<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HERTZ Manifesto — From Clubbers, For Clubbers</title>
  <meta name="description" content="The HERTZ manifesto. Why we started, what we believe, and what the dancefloor means to us. Bologna, 2023.">
  <meta name="theme-color" content="#08080d">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HERTZ Manifesto — From Clubbers, For Clubbers">
  <meta property="og:description" content="Why we started, what we believe, and what the dancefloor means to us. Bologna, 2023.">
  <meta property="og:image" content="https://hertz.club/assets/hertz-logo-official.png">
  <meta property="og:url" content="https://hertz.club/manifesto">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HERTZ Manifesto">
  <meta name="twitter:description" content="Why we started, what we believe, and what the dancefloor means to us.">
  <link rel="canonical" href="https://hertz.club/manifesto">
  <link rel="stylesheet" href="fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body { background: #08080d; color: #f5f5f3; font-family: 'HelveticaNeue', 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #08080d; }
    ::-webkit-scrollbar-thumb { background: rgba(20,72,137,0.4); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(20,72,137,0.7); }
    ::selection { background: rgba(0,212,255,0.25); color: #f5f5f3; }
    img { user-select: none; -webkit-user-drag: none; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    @media (max-width: 768px) {
      * { -webkit-tap-highlight-color: transparent; }
      html { font-size: 14px; }
      body { font-size: 14px; }
      input, textarea, select { font-size: 16px; }
    }
    @media (max-width: 480px) { html { font-size: 13px; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="hertz-shared.jsx"></script>
<script type="text/babel">
function ManifestoPage() {
  const C = window.Cv8;
  const R = window.R8;
  const mono = { fontFamily: "'JetBrains Mono', monospace" };
  const briq = { fontFamily: "'HelveticaNeue', 'Helvetica Neue', Helvetica, sans-serif" };
  const [isMobile, setIsMobile] = React.useState(window.innerWidth < 768);
  React.useEffect(() => {
    const r = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', r, { passive: true });
    return () => window.removeEventListener('resize', r);
  }, []);

  const STATS = [
    { label: 'Based in', value: 'Bologna, IT' },
    { label: 'Sound', value: 'Minimal & Deep-Tech' },
    { label: 'Active since', value: '2023' },
    { label: 'Editions', value: '024+' },
    { label: 'Homes', value: 'Kindergarten · Buongiorno Classic' },
  ];

  const FLOOR_GALLERY = [
    { img: 'assets/floor-1.jpg', date: '24.04', venue: 'Kindergarten' },
    { img: 'assets/floor-2.jpg', date: '24.04', venue: 'Kindergarten' },
    { img: 'assets/floor-3.jpg', date: '24.04', venue: 'Kindergarten' },
    { img: 'assets/floor-4.jpg', date: '24.04', venue: 'Kindergarten' },
    { img: 'assets/floor-5.jpg', date: '24.04', venue: 'Kindergarten' },
    { img: 'assets/floor-6.jpg', date: '26.12', venue: 'Kindergarten' },
    { img: 'assets/floor-7.jpg', date: '27.02', venue: 'Kindergarten' },
    { img: 'assets/floor-8.jpg', date: '27.02', venue: 'Kindergarten' },
  ];

  return (
    <div style={{ background: C.dark, minHeight: '100vh' }}>
      <window.Nav8 />
      <window.PageHero section="// 02 / MANIFESTO" title={"From clubbers,\nfor clubbers"} />

      {/* Full-bleed photo */}
      <div style={{ position: 'relative', height: 'clamp(320px,50vh,620px)', overflow: 'hidden' }}>
        <img
          src="assets/crowd-floor.jpg" alt="A packed dancefloor at a HERTZ night"
          style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center 35%', filter: 'saturate(0.55) brightness(0.75) contrast(1.08)' }}
        />
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg,rgba(8,8,13,0.4) 0%,rgba(8,8,13,0.8) 100%)' }} />
        <div style={{ position: 'absolute', bottom: 'clamp(28px,5vh,48px)', left: 0, right: 0, padding: '0 clamp(20px,4vw,56px)' }}>
          <div style={{ maxWidth: 1080, margin: '0 auto' }}>
            <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.blue, marginBottom: 10 }}>// BOLOGNA · 2023</div>
            <blockquote style={{ ...briq, fontSize: 'clamp(1.4rem,3vw,2.4rem)', fontWeight: 600, lineHeight: 1.2, color: C.light, maxWidth: 640, letterSpacing: '-0.02em', textWrap: 'pretty', fontStyle: 'normal', margin: 0 }}>
              “Too many nights were filling up with image and emptying out of listening.”
            </blockquote>
          </div>
        </div>
      </div>

      {/* Chapter text — editorial: text + single photo, alternating sides */}
      <section style={{ background: C.light, padding: 'clamp(64px,10vh,120px) clamp(20px,4vw,56px)' }}>
        <div style={{ maxWidth: 1080, margin: '0 auto' }}>

          {/* Chapter 01 — Origin · text left / photo right */}
          <R>
            <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: 'clamp(24px,4vw,64px)' }}>
              <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: isMobile ? 0 : 'clamp(8px,2vw,32px) 0' }}>
                <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.blue, marginBottom: 18 }}>// CHAPTER 01 — ORIGIN</div>
                <p style={{ fontSize: 'clamp(15px,1.4vw,17px)', lineHeight: 1.8, color: C.dark + 'cc', marginBottom: 18, textWrap: 'pretty' }}>
                  HERTZ started in Bologna in 2023. We were tired of nights built for the camera — rooms full of people half-watching, half-filming, with the music stuck somewhere in the background.
                </p>
                <p style={{ fontSize: 'clamp(15px,1.4vw,17px)', lineHeight: 1.8, color: C.dark + '88', textWrap: 'pretty' }}>
                  So we built the opposite: a floor where the record does the talking, and a good one can <span style={{ color: C.dark }}>roll for nine minutes</span> before anyone thinks to check the time.
                </p>
              </div>
              <div style={{ position: 'relative', overflow: 'hidden', borderRadius: 2, minHeight: isMobile ? 'auto' : 'clamp(300px,30vw,430px)', aspectRatio: isMobile ? '4/3' : 'auto', border: `1px solid ${C.dark}10` }}>
                <img src="assets/man-origin.jpg" alt="HERTZ dancefloor, Bologna" loading="lazy" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block', filter: 'saturate(0.7) contrast(1.05)' }} />
              </div>
            </div>
          </R>

          {/* Chapter 02 — The Room · photo left / text right */}
          <R delay={0.05}>
            <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: 'clamp(24px,4vw,64px)', marginTop: 'clamp(48px,8vw,104px)' }}>
              <div style={{ order: isMobile ? 2 : 1, position: 'relative', overflow: 'hidden', borderRadius: 2, minHeight: isMobile ? 'auto' : 'clamp(300px,30vw,430px)', aspectRatio: isMobile ? '4/3' : 'auto', border: `1px solid ${C.dark}10` }}>
                <img src="assets/man-room.jpg" alt="HERTZ booth and crowd" loading="lazy" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block', filter: 'saturate(0.7) contrast(1.05)' }} />
              </div>
              <div style={{ order: isMobile ? 1 : 2, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: isMobile ? 0 : 'clamp(8px,2vw,32px) 0' }}>
                <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.blue, marginBottom: 18 }}>// CHAPTER 02 — THE ROOM</div>
                <p style={{ ...briq, fontSize: 'clamp(18px,2.2vw,26px)', fontWeight: 700, lineHeight: 1.3, color: C.dark, letterSpacing: '-0.02em', marginBottom: 18, textWrap: 'pretty' }}>
                  A club is a room. A system. A crowd close to the booth. A bassline that hits the body before it reaches the mind.
                </p>
                <p style={{ fontSize: 'clamp(15px,1.4vw,17px)', lineHeight: 1.8, color: C.dark + '88', textWrap: 'pretty' }}>
                  We book artists we'd pay to see ourselves. Minimal, deep tech, the kind of groove that rolls for hours and never tips into noise. We pick rooms for how they sound, not how big they look — small enough to <span style={{ color: C.dark }}>feel the kick through the floor</span>, big enough to disappear.
                </p>
              </div>
            </div>
          </R>

          {/* Chapter 03 — The Code · full-width climax */}
          <R delay={0.1}>
            <div style={{ marginTop: 'clamp(64px,11vw,150px)', maxWidth: 960 }}>
              <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.blue, marginBottom: 24 }}>// CHAPTER 03 — THE FLOOR</div>
              <p style={{ ...briq, fontSize: 'clamp(1.9rem,5vw,4rem)', fontWeight: 700, lineHeight: 0.95, letterSpacing: '-0.04em', color: C.dark, textWrap: 'pretty', margin: 0 }}>
                Turn the lights down, the system up, and let the record run. The floor knows what to do.
              </p>
            </div>
          </R>

        </div>
      </section>

      {/* Stats bar */}
      <section style={{ background: C.darkSoft, padding: 'clamp(48px,6vh,80px) clamp(20px,4vw,56px)', borderTop: `1px solid ${C.light}0a`, borderBottom: `1px solid ${C.light}0a` }}>
        <R>
          <div style={{ maxWidth: 1400, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))', gap: 40 }}>
            {STATS.map(s => (
              <div key={s.label}>
                <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.light + '44', marginBottom: 10 }}>// {s.label.toUpperCase()}</div>
                <div style={{ ...briq, fontSize: 'clamp(16px,1.8vw,22px)', fontWeight: 700, color: C.light, letterSpacing: '-0.02em' }}>{s.value}</div>
              </div>
            ))}
          </div>
        </R>
      </section>

      {/* Credo — Clubbing Collective (brand identity) */}
      <section style={{ background: C.dark, padding: 'clamp(72px,12vh,150px) clamp(20px,4vw,56px)', borderTop: `1px solid ${C.light}0a`, position: 'relative', overflow: 'hidden' }}>
        <div style={{ maxWidth: 1080, margin: '0 auto', position: 'relative' }}>
          <R delay={0.08}>
           <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1.12fr 0.88fr', gap: isMobile ? 16 : 'clamp(18px,2.4vw,28px)', alignItems: 'stretch' }}>
            <figure style={{ position: 'relative', margin: 0, textAlign: 'left', background: 'linear-gradient(180deg, #16161f 0%, #0f0f16 100%)', border: `1px solid ${C.light}0f`, padding: 'clamp(36px,5vw,72px) clamp(28px,5vw,68px) clamp(32px,4vw,56px)', overflow: 'hidden' }}>
              <div aria-hidden="true" style={{ position: 'absolute', top: 0, left: 0, height: 2, width: 64, background: C.blue }} />

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 20, marginBottom: 'clamp(20px,3vw,32px)' }}>
                <span style={{ ...mono, fontSize: 10, letterSpacing: '0.24em', color: C.blue + 'cc', paddingTop: 10 }}>// CLUBBING COLLECTIVE</span>
                <span aria-hidden="true" style={{ fontFamily: 'Georgia, "Times New Roman", serif', fontSize: 'clamp(3.5rem,7vw,5.5rem)', lineHeight: 0.75, color: C.blue, opacity: 0.9 }}>”</span>
              </div>

              <blockquote style={{ ...briq, margin: 0 }}>
                <p style={{ fontSize: 'clamp(1.4rem,3vw,2.1rem)', fontWeight: 700, lineHeight: 1.08, letterSpacing: '-0.025em', color: C.light, margin: '0 0 clamp(20px,3vw,28px)' }}>
                  We live in frequency<span style={{ color: C.blue }}>.</span>
                </p>
                {[
                  'Every sound, every move, every idea is a pulse. We tune in to what’s real — not the noise, not the hype, but the signal beneath it.',
                  'We believe in motion over perfection, in design that feels, and in sound that speaks without words.',
                  'Hertz is where rhythm becomes identity — where the beat builds the brand, where less is more and meaning is everything.',
                ].map((t, i) => (
                  <p key={i} style={{ fontSize: 'clamp(0.95rem,1.45vw,1.12rem)', fontWeight: 400, lineHeight: 1.72, letterSpacing: '0', color: C.light + 'a6', margin: '0 0 16px', textWrap: 'pretty' }}>{t}</p>
                ))}
                <p style={{ fontSize: 'clamp(1.05rem,1.7vw,1.3rem)', fontWeight: 700, lineHeight: 1.32, letterSpacing: '-0.015em', color: C.light, margin: 'clamp(20px,3vw,28px) 0 0', textWrap: 'pretty' }}>
                  We do not follow trends. We shape energy.{' '}
                  <span style={{ color: C.blue }}>We create moments that resonate.</span>
                </p>
              </blockquote>

              <figcaption style={{ ...mono, fontSize: 10, letterSpacing: '0.22em', color: C.light + '44', marginTop: 'clamp(28px,4vw,40px)', paddingTop: 20, borderTop: `1px solid ${C.light}10`, textTransform: 'uppercase' }}>Hertz — Clubbing Collective</figcaption>
            </figure>
            <div style={{ position: 'relative', overflow: 'hidden', border: `1px solid ${C.light}0f`, aspectRatio: isMobile ? '4/5' : 'auto' }}>
              <img src="assets/man-credo.jpg" alt="HERTZ — a night on the dancefloor" loading="lazy" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', filter: 'saturate(0.7) contrast(1.05)' }} />
            </div>
           </div>
          </R>
        </div>
      </section>

      {/* Safe space */}
      <section style={{ background: C.light, padding: 'clamp(56px,8vh,96px) clamp(20px,4vw,56px)' }}>
        <R>
          <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.blue, marginBottom: 12 }}>// THE DANCEFLOOR IS FOR EVERYONE</div>
          <h2 style={{ ...briq, fontSize: 'clamp(2rem,6vw,5rem)', fontWeight: 700, lineHeight: 0.9, letterSpacing: '-0.04em', color: C.dark, marginBottom: 48 }}>
            The dancefloor belongs<br />to everyone<span style={{ color: C.blue }}>.</span>
          </h2>
        </R>
        <style>{`.hz-floor-scroll::-webkit-scrollbar{display:none}`}</style>
        <R delay={0.1}>
          <div
            className="hz-floor-scroll"
            style={{
              display: 'flex', gap: 16,
              overflowX: 'auto', overflowY: 'hidden',
              scrollSnapType: 'x mandatory', WebkitOverflowScrolling: 'touch',
              scrollbarWidth: 'none',
              marginLeft: 'calc(-1 * clamp(20px,4vw,56px))',
              marginRight: 'calc(-1 * clamp(20px,4vw,56px))',
              padding: '4px clamp(20px,4vw,56px) 24px',
              marginBottom: 40,
            }}
          >
            {FLOOR_GALLERY.map((g, i) => (
              <figure
                key={i}
                style={{
                  flex: '0 0 auto', position: 'relative',
                  width: 'clamp(240px, 68vw, 320px)', aspectRatio: '3/4',
                  overflow: 'hidden', scrollSnapAlign: 'start',
                  background: C.dark, cursor: 'pointer', margin: 0,
                  border: `1px solid ${C.dark}12`,
                  boxShadow: '0 18px 40px -20px rgba(8,8,13,0.55)',
                  transition: 'transform 0.4s cubic-bezier(.22,1,.36,1), box-shadow 0.4s',
                }}
                onMouseEnter={e => {
                  e.currentTarget.style.transform = 'translateY(-6px)';
                  e.currentTarget.style.boxShadow = '0 28px 56px -22px rgba(8,8,13,0.7)';
                  const im = e.currentTarget.querySelector('img'); if (im) im.style.transform = 'scale(1.05)';
                }}
                onMouseLeave={e => {
                  e.currentTarget.style.transform = 'translateY(0)';
                  e.currentTarget.style.boxShadow = '0 18px 40px -20px rgba(8,8,13,0.55)';
                  const im = e.currentTarget.querySelector('img'); if (im) im.style.transform = 'scale(1)';
                }}
              >
                <img
                  src={g.img} alt={`HERTZ crowd — ${g.date}, ${g.venue}`} loading="lazy"
                  style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block', filter: 'saturate(0.62) contrast(1.05)', transition: 'transform 0.6s cubic-bezier(.22,1,.36,1)' }}
                />
                <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(8,8,13,0) 45%, rgba(8,8,13,0.82) 100%)' }} />
                <div style={{ position: 'absolute', top: 14, left: 14, ...mono, fontSize: 10, letterSpacing: '0.16em', color: C.light + 'cc' }}>{String(i + 1).padStart(2, '0')}/{String(FLOOR_GALLERY.length).padStart(2, '0')}</div>
                <figcaption style={{ position: 'absolute', bottom: 14, left: 14, right: 14, ...mono, fontSize: 10, letterSpacing: '0.14em', color: C.light, textTransform: 'uppercase' }}>
                  {g.date} · {g.venue}
                </figcaption>
              </figure>
            ))}
          </div>
        </R>
        <R delay={0.15}>
          <div style={{ ...mono, fontSize: 10, letterSpacing: '0.18em', color: C.dark + '44', marginBottom: 28, display: 'flex', alignItems: 'center', gap: 8 }}>
            <span>←</span><span>DRAG · SWIPE</span><span>→</span>
          </div>
          <p style={{ fontSize: 'clamp(13px,1.3vw,15px)', color: C.dark + '88', lineHeight: 1.85, maxWidth: 560, textWrap: 'pretty' }}>
            No harassment, no hate, no discrimination of any kind. Respect boundaries — yours and others'. We hold each other accountable. Everyone is welcome on the dancefloor.
          </p>
        </R>
      </section>

      <window.Footer8 />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<ManifestoPage />);
</script>
</body>
</html>
