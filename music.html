<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hertz Music, Resident Sets & Mixes</title>
  <meta name="description" content="Hertz music: resident sets and live recordings on SoundCloud. Minimal and deep-tech mixes from Bologna, straight from the booth.">
  <meta name="theme-color" content="#08080d">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hertz Music, Resident Sets & Mixes">
  <meta property="og:description" content="Resident sets and live recordings. Minimal and deep-tech, from the booth in Bologna.">
  <meta property="og:image" content="https://hertz.club/assets/hertz-logo-official.png">
  <meta property="og:url" content="https://hertz.club/music">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hertz Music, Resident Sets & Mixes">
  <meta name="twitter:description" content="Resident sets and live recordings. Minimal and deep-tech, from the booth.">
  <link rel="canonical" href="https://hertz.club/music">
  <link rel="stylesheet" href="fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body { background: #08080d; color: #f5f5f3; font-family: 'HelveticaNeue', 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #08080d; }
    ::-webkit-scrollbar-thumb { background: rgba(20,72,137,0.4); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(20,72,137,0.7); }
    ::selection { background: rgba(20,72,137,0.30); color: #f5f5f3; }
    img { user-select: none; -webkit-user-drag: none; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    @keyframes waveAnim { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    @media (max-width: 768px) {
      * { -webkit-tap-highlight-color: transparent; }
      html { font-size: 14px; }
      body { font-size: 14px; }
    }
    @media (max-width: 480px) { html { font-size: 13px; } }
    @media (max-width: 860px) {
      .music-grid { grid-template-columns: 1fr !important; }
      .music-grid .side-photo { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="hertz-shared.jsx"></script>
<script type="text/babel">
// SoundCloud — recorded sets, guest mixes, live recordings.
const SC_SETS = [
  { artist: 'Federico Apadula', title: 'Tomi & Kesh × Federico Apadula',          img: 'assets/dj-apadula.jpg', tag: 'FEATURED', url: 'https://soundcloud.com/tomi-and-kesh/tomi-kesh-federico-apadula' },
  { artist: 'Federico Apadula', title: 'Live @ Sonder — City Hall, Barcelona',     img: 'assets/dj-apadula.jpg', url: 'https://soundcloud.com/hertzclubbingcollective/federico-apadula-sonder-city-hall-barcelona-16-03-24-opening-chicks-luv-us' },
  { artist: 'Federico Apadula', title: 'MMM077 — Special Guest Mix',               img: 'assets/dj-apadula.jpg', url: 'https://soundcloud.com/lambertogabrieli/mmm077-federico-apadula-special-guest-mix-jun-2021' },
  { artist: 'Alberto B',        title: 'Hot Girl',                                 img: 'assets/dj-alberto.jpg', url: 'https://soundcloud.com/alberto-baccianti/alberto-b-hot-girl' },
  { artist: 'Alberto B',        title: 'In My Zone',                               img: 'assets/dj-alberto.jpg', url: 'https://soundcloud.com/alberto-baccianti/in-my-zone' },
  { artist: 'Alberto B',        title: 'You Should B Dancing',                     img: 'assets/dj-alberto.jpg', url: 'https://soundcloud.com/alberto-baccianti/alberto-b-you-should-b-dancing' },
];

const SC_PROFILE = 'https://soundcloud.com/hertzclubbingcollective';

// Spotify — artist profiles with embed IDs.
const SP_ARTISTS = [
  { name: 'Federico Apadula', role: 'Resident', id: '0hS1cnWGJvml5gSHRKHtGi', img: 'assets/dj-apadula.jpg', url: 'https://open.spotify.com/artist/0hS1cnWGJvml5gSHRKHtGi' },
  { name: 'Alberto B',        role: 'Resident', id: '7kHLiQODROJuJtGEgAYd8d', img: 'assets/dj-alberto.jpg', url: 'https://open.spotify.com/artist/7kHLiQODROJuJtGEgAYd8d' },
];

function Waveform({ playing, color }) {
  const bars = Array.from({ length: 28 }, (_, i) => i);
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 2, height: 28 }} aria-hidden="true">
      {bars.map(i => (
        <div key={i} style={{
          width: 2, borderRadius: 1,
          background: color || '#144889',
          height: `${20 + Math.sin(i * 0.8) * 14}px`,
          opacity: playing ? 1 : 0.35,
          animation: playing ? `waveAnim ${0.6 + (i % 5) * 0.12}s ease-in-out infinite` : 'none',
          animationDelay: `${(i % 7) * 0.06}s`,
        }} />
      ))}
    </div>
  );
}

function MusicPage() {
  const C = window.Cv8;
  const R = window.R8;
  const mono = { fontFamily: "'JetBrains Mono', monospace" };
  const briq = { fontFamily: "'HelveticaNeue', 'Helvetica Neue', Helvetica, sans-serif" };
  const [playing, setPlaying] = React.useState(null);

  return (
    <div style={{ background: C.dark, minHeight: '100vh' }}>
      <window.Nav8 />

      {/* ── HERO with photo ── */}
      <section style={{
        minHeight: '80vh', position: 'relative', overflow: 'hidden',
        display: 'flex', alignItems: 'flex-end',
        padding: 'clamp(100px,15vh,140px) clamp(20px,4vw,56px) clamp(48px,8vh,80px)',
      }}>
        <div style={{
          position: 'absolute', inset: 0,
          backgroundImage: 'url(assets/music-hero.jpg?v=2)',
          backgroundSize: 'cover', backgroundPosition: 'center 30%',
          filter: 'saturate(0.6) brightness(0.65) contrast(1.05)',
        }} />
        <div style={{
          position: 'absolute', inset: 0,
          background: 'linear-gradient(0deg, rgba(8,8,13,0.9) 0%, rgba(8,8,13,0.3) 50%, rgba(8,8,13,0.1) 100%)',
        }} />
        <div style={{ position: 'relative', zIndex: 2, maxWidth: 1080, margin: '0 auto', width: '100%' }}>
          <R>
            <div style={{ ...mono, fontSize: 11, letterSpacing: '0.2em', color: C.blue, marginBottom: 16 }}>// 04 / MUSIC</div>
            <h1 style={{ ...briq, fontSize: 'clamp(3rem,10vw,8rem)', fontWeight: 700, lineHeight: 0.88, letterSpacing: '-0.04em', color: C.light }}>
              The sound<span style={{ color: C.blue }}>.</span>
            </h1>
            <p style={{ fontSize: 'clamp(15px,1.5vw,18px)', lineHeight: 1.7, color: C.light + 'aa', maxWidth: 520, marginTop: 24 }}>
              Recorded sets, studio cuts and live nights from the residents. Straight from the booth.
            </p>
          </R>
        </div>
      </section>

      {/* ── DJ CAROUSEL ── */}
      <section style={{ background: C.light, padding: 'clamp(32px,5vh,56px) 0', overflow: 'hidden' }}>
        <div style={{ maxWidth: 1080, margin: '0 auto', padding: '0 clamp(20px,4vw,56px)' }}>
          <R>
            <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.dark + '44', marginBottom: 16 }}>// FROM THE BOOTH</div>
          </R>
        </div>
        <R delay={0.1}>
          <div style={{
            display: 'flex', gap: 12, overflowX: 'auto', scrollSnapType: 'x mandatory',
            padding: '0 clamp(20px,4vw,56px)', scrollbarWidth: 'none', msOverflowStyle: 'none',
            WebkitOverflowScrolling: 'touch',
          }}>
            {[
              { src: 'assets/dj-apadula.jpg', label: 'Federico Apadula' },
              { src: 'assets/dj-alberto.jpg', label: 'Alberto B' },
              { src: 'assets/dj-manco.jpg', label: 'Tommaso Mancò' },
              { src: 'assets/dj-giusti.jpg', label: 'Leonardo Giusti' },
              { src: 'assets/dj-01.jpg', label: null },
              { src: 'assets/dj-02.jpg', label: null },
              { src: 'assets/dj-03.jpg', label: null },
              { src: 'assets/dj-04.jpg', label: null },
              { src: 'assets/dj-05.jpg', label: null },
              { src: 'assets/dj-fava.jpg', label: null },
            ].map((photo, i) => (
              <div key={i} style={{ flexShrink: 0, scrollSnapAlign: 'start', width: 'clamp(200px,22vw,280px)', position: 'relative', overflow: 'hidden' }}>
                <img src={photo.src} alt={photo.label || 'DJ'} loading="lazy" style={{ width: '100%', aspectRatio: '3/4', objectFit: 'cover', filter: 'saturate(0.45) brightness(0.75)', display: 'block' }} />
                {photo.label && (
                  <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: '24px 12px 10px', background: 'linear-gradient(0deg, rgba(8,8,13,0.85) 0%, transparent 100%)' }}>
                    <div style={{ ...mono, fontSize: 9, color: C.light + '88', letterSpacing: '0.14em' }}>{photo.label}</div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </R>
      </section>

      {/* ── SOUNDCLOUD ── */}
      <section style={{ background: C.dark, padding: 'clamp(48px,6vh,80px) clamp(20px,4vw,56px)' }}>
        <div style={{ maxWidth: 1080, margin: '0 auto' }}>
          <R>
            <div style={{ ...mono, fontSize: 11, letterSpacing: '0.2em', color: C.blue, marginBottom: 16 }}>// SOUNDCLOUD</div>
            <img src="assets/logo-soundcloud.png" alt="SoundCloud" style={{ height: 'clamp(32px,5vw,48px)', width: 'auto', display: 'block', marginBottom: 12, opacity: 0.9 }} />
            <p style={{ ...mono, fontSize: 11, color: C.light + '55', letterSpacing: '0.08em', marginBottom: 48 }}>Sets, recordings & guest mixes</p>
          </R>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }} role="list">
              {SC_SETS.map((mix, i) => (
                <R key={i} delay={i * 0.05}>
                  <div
                    role="listitem"
                    onClick={() => setPlaying(playing === i ? null : i)}
                    aria-label={`${playing === i ? 'Close' : 'Play'} ${mix.title} by ${mix.artist}`}
                    tabIndex={0}
                    onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setPlaying(playing === i ? null : i); } }}
                    style={{ display: 'grid', gridTemplateColumns: '56px 1fr', gap: 16, alignItems: 'center', padding: '14px 0', borderBottom: `1px solid ${C.light}0e`, cursor: 'pointer', transition: 'background 0.2s', outline: 'none' }}
                    onMouseEnter={e => e.currentTarget.style.background = C.darkSoft}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                    onFocus={e => e.currentTarget.style.background = C.darkSoft}
                    onBlur={e => e.currentTarget.style.background = 'transparent'}
                  >
                    <div style={{ position: 'relative', width: 56, height: 56, overflow: 'hidden', flexShrink: 0 }}>
                      <img src={mix.img} alt={mix.artist} loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', filter: 'saturate(0.5) brightness(0.7)' }} />
                      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.35)' }}>
                        <span aria-hidden="true" style={{ fontSize: 18, color: C.light, opacity: playing === i ? 1 : 0.7 }}>{playing === i ? '⏸' : '▶'}</span>
                      </div>
                      {mix.tag && <div style={{ position: 'absolute', top: 0, left: 0, background: C.blue, padding: '2px 5px', ...mono, fontSize: 8, color: C.light, letterSpacing: '0.12em' }}>{mix.tag}</div>}
                    </div>
                    <div>
                      <div style={{ ...mono, fontSize: 9, color: C.light + '55', letterSpacing: '0.16em', marginBottom: 4, textTransform: 'uppercase' }}>{mix.artist}</div>
                      <h3 style={{ ...briq, fontSize: 'clamp(0.9rem,1.5vw,1.1rem)', fontWeight: 700, letterSpacing: '-0.02em', color: C.light, margin: 0 }}>{mix.title}</h3>
                      {playing === i && (
                        <div style={{ marginTop: 12 }} onClick={e => e.stopPropagation()}>
                          <iframe title={`SoundCloud, ${mix.title}`} width="100%" height="120" frameBorder="0" scrolling="no" allow="autoplay" style={{ display: 'block' }}
                            src={`https://w.soundcloud.com/player/?url=${encodeURIComponent(mix.url)}&color=%23144889&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&visual=false`} />
                          <div style={{ ...mono, fontSize: 9, color: C.light + '44', letterSpacing: '0.14em', marginTop: 6 }}>
                            <a href={mix.url} target="_blank" rel="noopener noreferrer" style={{ color: C.blue }}>Open on SoundCloud ↗</a>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </R>
              ))}

          <R delay={0.2}>
            <div style={{ marginTop: 32, paddingTop: 20, borderTop: `1px solid ${C.light}0e` }}>
              <a href={SC_PROFILE} target="_blank" rel="noopener noreferrer"
                style={{ ...mono, fontSize: 11, letterSpacing: '0.14em', color: C.light + '55', transition: 'color 0.2s', display: 'inline-flex', alignItems: 'center', minHeight: 44 }}
                onMouseEnter={e => e.currentTarget.style.color = C.blue}
                onMouseLeave={e => e.currentTarget.style.color = C.light + '55'}
              >Hertz on SoundCloud ↗</a>
            </div>
          </R>
          </div>
        </div>
      </section>

      {/* ── SPOTIFY ── */}
      <section style={{ background: C.light, padding: 'clamp(48px,6vh,80px) clamp(20px,4vw,56px)' }}>
        <div style={{ maxWidth: 1080, margin: '0 auto' }}>
          <R>
            <div style={{ ...mono, fontSize: 11, letterSpacing: '0.2em', color: C.blue, marginBottom: 16 }}>// SPOTIFY</div>
            <img src="assets/logo-spotify.png" alt="Spotify" style={{ height: 'clamp(28px,4vw,40px)', width: 'auto', display: 'block', marginBottom: 12, opacity: 0.9, filter: 'invert(1)' }} />
            <p style={{ ...mono, fontSize: 11, color: C.dark + '55', letterSpacing: '0.08em', marginBottom: 48 }}>Original tracks & releases</p>
          </R>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            {SP_ARTISTS.map((a, i) => (
              <R key={a.id} delay={i * 0.1}>
                <a href={a.url} target="_blank" rel="noopener noreferrer"
                  style={{
                    display: 'grid', gridTemplateColumns: '72px 1fr auto', gap: 20, alignItems: 'center',
                    padding: '20px 24px', background: C.dark, border: `1px solid ${C.light}10`,
                    textDecoration: 'none', transition: 'border-color 0.2s',
                  }}
                  onMouseEnter={e => e.currentTarget.style.borderColor = '#1DB954'}
                  onMouseLeave={e => e.currentTarget.style.borderColor = C.light + '10'}
                >
                  <div style={{ width: 72, height: 72, borderRadius: '50%', overflow: 'hidden', flexShrink: 0 }}>
                    <img src={a.img} alt={a.name} loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', filter: 'saturate(0.5) brightness(0.75)' }} />
                  </div>
                  <div>
                    <div style={{ ...mono, fontSize: 9, color: C.light + '55', letterSpacing: '0.16em', marginBottom: 5, textTransform: 'uppercase' }}>{a.role}</div>
                    <div style={{ ...briq, fontSize: 'clamp(1rem,1.8vw,1.25rem)', fontWeight: 700, letterSpacing: '-0.02em', color: C.light }}>{a.name}</div>
                  </div>
                  <div style={{
                    ...mono, fontSize: 10, letterSpacing: '0.14em', color: '#1DB954',
                    whiteSpace: 'nowrap',
                  }}>Listen ↗</div>
                </a>
              </R>
            ))}
          </div>
        </div>
      </section>

      <window.Footer8 bannerLight={false} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<MusicPage />);
</script>
</body>
</html>
