<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hertz — Team</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08080d">
  <link rel="stylesheet" href="fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body { background: #08080d; color: #f5f5f3; font-family: 'JetBrains Mono', monospace; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(20,72,137,0.4); }
    ::selection { background: rgba(20,72,137,0.30); color: #f5f5f3; }
    a { color: inherit; text-decoration: none; }
    input, button { font-family: inherit; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid rgba(245,245,243,0.08); font-size: 12px; letter-spacing: 0.02em; vertical-align: top; }
    th { color: #144889; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }
    td { color: rgba(245,245,243,0.85); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: clamp(28px,6vh,72px) clamp(16px,4vw,48px); }
    @media (max-width: 768px) { html { font-size: 14px; } input { font-size: 16px; } th, td { padding: 7px 8px; font-size: 11px; } }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel">
const BLUE = '#144889', LIGHT = '#f5f5f3', DARK = '#08080d';
const mono = { fontFamily: "'JetBrains Mono', monospace" };

function csv(rows) {
  const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  return rows.map(r => r.map(esc).join(',')).join('\r\n');
}
function download(name, text) {
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function fmt(ts) {
  if (!ts) return '';
  try { const d = new Date(ts); return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return ts; }
}

function Login({ onAuth }) {
  const [pw, setPw] = React.useState('');
  const [status, setStatus] = React.useState('idle'); // idle | sending | error
  const submit = (e) => {
    e.preventDefault();
    if (!pw) return;
    setStatus('sending');
    fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
      .then(r => r.json().then(d => ({ ok: r.ok, d })))
      .then(({ ok, d }) => { if (ok && d.ok) onAuth(pw, d); else setStatus('error'); })
      .catch(() => setStatus('error'));
  };
  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <form onSubmit={submit} style={{ width: '100%', maxWidth: 340 }}>
        <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: BLUE, marginBottom: 18 }}>// HERTZ TEAM</div>
        <input value={pw} onChange={e => setPw(e.target.value)} type="password" placeholder="Password" autoFocus
          style={{ width: '100%', background: 'transparent', border: `1px solid ${LIGHT}22`, color: LIGHT, padding: '13px 14px', ...mono, fontSize: 13, outline: 'none', marginBottom: 14 }} />
        {status === 'error' && <div style={{ ...mono, fontSize: 11, color: '#d06a6a', marginBottom: 14 }}>// Wrong password</div>}
        <button type="submit" disabled={status === 'sending'} style={{ width: '100%', background: BLUE, color: LIGHT, border: 'none', padding: '13px', cursor: 'pointer', ...mono, fontSize: 12, letterSpacing: '0.16em', textTransform: 'uppercase', opacity: status === 'sending' ? 0.6 : 1 }}>
          {status === 'sending' ? 'Checking…' : 'Enter →'}
        </button>
      </form>
    </div>
  );
}

function Section({ title, count, children, right }) {
  return (
    <div style={{ marginBottom: 44 }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 16, marginBottom: 14, flexWrap: 'wrap' }}>
        <div style={{ ...mono, fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: LIGHT }}>
          {title} <span style={{ color: BLUE }}>· {count}</span>
        </div>
        {right}
      </div>
      {children}
    </div>
  );
}

function ExportBtn({ onClick }) {
  return (
    <button onClick={onClick} style={{ ...mono, fontSize: 9, letterSpacing: '0.14em', textTransform: 'uppercase', color: LIGHT + 'aa', background: 'transparent', border: `1px solid ${LIGHT}22`, padding: '7px 13px', cursor: 'pointer' }}>
      ↓ CSV
    </button>
  );
}

function Admin({ data, onRefresh, refreshing }) {
  const bookings = data.bookings || [];
  const events = data.events || [];

  const exportBookings = () => {
    const rows = [['Date', 'First name', 'Last name', 'Email', 'Phone', 'Interested in', 'Artist', 'Event', 'Event date', 'City/venue', 'Budget', 'Message']];
    bookings.forEach(b => rows.push([fmt(b.ts), b.firstName, b.lastName, b.email, b.phone, b.type, b.artist, b.eventName, b.date, b.city, b.budget, b.message]));
    download('hertz-bookings.csv', csv(rows));
  };
  const exportEvent = (ev) => {
    const rows = [['Date', 'Name', 'Surname', 'Email']];
    ev.entries.forEach(en => rows.push([fmt(en.ts), en.name, en.surname, en.email]));
    download('hertz-list-' + ev.id + '.csv', csv(rows));
  };
  const exportAll = () => {
    const rows = [['Event id', 'Event', 'Date', 'Name', 'Surname', 'Email']];
    events.forEach(ev => ev.entries.forEach(en => rows.push([ev.id, ev.title, fmt(en.ts), en.name, en.surname, en.email])));
    download('hertz-all-lists.csv', csv(rows));
  };

  const totalReg = events.reduce((s, e) => s + (e.entries ? e.entries.length : 0), 0);

  return (
    <div className="wrap">
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 38, flexWrap: 'wrap', gap: 12 }}>
        <div>
          <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: BLUE, marginBottom: 8 }}>// HERTZ TEAM · DASHBOARD</div>
          <div style={{ ...mono, fontSize: 11, letterSpacing: '0.06em', color: LIGHT + '88' }}>{bookings.length} bookings · {totalReg} registrations across {events.length} events</div>
        </div>
        <button onClick={onRefresh} disabled={refreshing} style={{ ...mono, fontSize: 9, letterSpacing: '0.14em', textTransform: 'uppercase', color: LIGHT + 'aa', background: 'transparent', border: `1px solid ${LIGHT}22`, padding: '8px 14px', cursor: 'pointer', opacity: refreshing ? 0.5 : 1 }}>
          {refreshing ? 'Refreshing…' : '↻ Refresh'}
        </button>
      </div>

      <Section title="Guest lists" count={events.length} right={events.length ? <ExportBtn onClick={exportAll} /> : null}>
        {events.length === 0 && <div style={{ ...mono, fontSize: 12, color: LIGHT + '55' }}>No registrations yet.</div>}
        {events.map(ev => (
          <div key={ev.id} style={{ marginBottom: 26, border: `1px solid ${LIGHT}10` }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, padding: '12px 12px', background: 'rgba(20,72,137,0.07)', flexWrap: 'wrap' }}>
              <div style={{ ...mono, fontSize: 12, letterSpacing: '0.04em', color: LIGHT }}>
                <span style={{ color: BLUE }}>HZ.{ev.id}</span> &nbsp;{ev.title} <span style={{ color: LIGHT + '66' }}>· {ev.entries.length}</span>
              </div>
              <ExportBtn onClick={() => exportEvent(ev)} />
            </div>
            {ev.entries.length > 0 && (
              <div style={{ overflowX: 'auto' }}>
                <table>
                  <thead><tr><th>#</th><th>When</th><th>Name</th><th>Surname</th><th>Email</th></tr></thead>
                  <tbody>
                    {ev.entries.map((en, i) => (
                      <tr key={i}><td style={{ color: LIGHT + '44' }}>{i + 1}</td><td>{fmt(en.ts)}</td><td>{en.name}</td><td>{en.surname}</td><td>{en.email}</td></tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        ))}
      </Section>

      <Section title="Booking requests" count={bookings.length} right={bookings.length ? <ExportBtn onClick={exportBookings} /> : null}>
        {bookings.length === 0 && <div style={{ ...mono, fontSize: 12, color: LIGHT + '55' }}>No booking requests yet.</div>}
        {bookings.length > 0 && (
          <div style={{ overflowX: 'auto' }}>
            <table>
              <thead><tr><th>When</th><th>Name</th><th>Contact</th><th>For</th><th>Event</th><th>Date</th><th>City</th><th>Budget</th><th>Message</th></tr></thead>
              <tbody>
                {bookings.map((b, i) => (
                  <tr key={i}>
                    <td>{fmt(b.ts)}</td>
                    <td>{b.firstName} {b.lastName}</td>
                    <td>{b.email}<br/><span style={{ color: LIGHT + '66' }}>{b.phone}</span></td>
                    <td>{b.type === 'artist' ? (b.artist || 'Artist') : 'Hertz format'}</td>
                    <td>{b.eventName}</td>
                    <td>{b.date}</td>
                    <td>{b.city}</td>
                    <td>{b.budget}</td>
                    <td style={{ maxWidth: 240, whiteSpace: 'pre-wrap' }}>{b.message}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Section>
    </div>
  );
}

function App() {
  const [auth, setAuth] = React.useState(null); // { pw, data }
  const [refreshing, setRefreshing] = React.useState(false);

  const refresh = (pw) => {
    setRefreshing(true);
    fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
      .then(r => r.json())
      .then(d => { if (d.ok) setAuth(a => ({ ...a, data: d })); })
      .catch(() => {})
      .finally(() => setRefreshing(false));
  };

  if (!auth) return <Login onAuth={(pw, data) => setAuth({ pw, data })} />;
  return <Admin data={auth.data} refreshing={refreshing} onRefresh={() => refresh(auth.pw)} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
