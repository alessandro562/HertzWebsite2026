  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      background: #08080d; color: #f5f5f3;
      font-family: 'HelveticaNeue', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    @keyframes scan { 0%,100% { opacity:0.25; } 50% { opacity:0.55; } }
    @keyframes blink { 0%,50% { opacity:1; } 50.01%,100% { opacity:0; } }
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #08080d; }
    ::-webkit-scrollbar-thumb { background: rgba(20,72,137,0.4); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(20,72,137,0.7); }
    ::selection { background: rgba(20,72,137,0.30); color: #f5f5f3; }
    img { user-select: none; -webkit-user-drag: none; max-width: 100%; height: auto; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; }
    canvas { display: block; }
    
    /* Mobile optimization */
    @media (max-width: 768px) {
      * { -webkit-tap-highlight-color: transparent; }
      html { font-size: 14px; }
      body { font-size: 14px; line-height: 1.6; }
      input, textarea, select { font-size: 16px; }
      input[type="range"] { -webkit-appearance: slider-horizontal; width: 100%; }
    }
    
    @media (max-width: 480px) {
      html { font-size: 13px; }
      body { overflow-x: hidden; }
      canvas { max-width: 100%; height: auto; }
      button { min-height: 44px; min-width: 44px; }
      a { -webkit-touch-callout: none; }
    }

    /* Prevent iOS 100vh > visible viewport bug, use small viewport height on mobile */
    @supports (min-height: 100svh) {
      @media (max-width: 768px) {
        .hz-mobile-hero { min-height: 100svh !important; }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    :focus-visible { outline: 2px solid #144889; outline-offset: 2px; }
  </style>
