<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HERTZ Artists — Residents & Guests</title>
  <meta name="description" content="The HERTZ residents: Federico Apadula, Tommaso Mancò, Alberto B, Leonardo Giusti. Four DJs. One direction.">
  <meta name="theme-color" content="#08080d">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HERTZ Artists — Residents & Guests">
  <meta property="og:description" content="The HERTZ residents: Federico Apadula, Tommaso Mancò, Alberto B, Leonardo Giusti. Four DJs. One direction.">
  <meta property="og:image" content="https://hertz.club/assets/hertz-logo-official.png">
  <meta property="og:url" content="https://hertz.club/artists">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HERTZ Artists — Residents & Guests">
  <meta name="twitter:description" content="Four residents. One direction. Bologna minimal and deep-tech.">
  <link rel="canonical" href="https://hertz.club/artists">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body { background: #f5f5f3; color: #08080d; font-family: 'Bricolage Grotesque', sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #08080d; }
    ::-webkit-scrollbar-thumb { background: rgba(20,72,137,0.4); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(20,72,137,0.7); }
    ::selection { background: rgba(0,212,255,0.25); color: #f5f5f3; }
    img { user-select: none; -webkit-user-drag: none; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    @media (max-width: 768px) {
      * { -webkit-tap-highlight-color: transparent; }
      html { font-size: 14px; }
      body { font-size: 14px; }
    }
    @media (max-width: 480px) { html { font-size: 13px; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="hertz-shared.jsx"></script>
<script type="text/babel">
const RESIDENTS = [
  { name: 'Federico Apadula', slug: 'federico-apadula', role: 'Founder · Art Director · DJ & Producer', img: 'assets/dj-apadula.jpg', n: '01', freq: '120 Hz', origin: 'Bologna, IT', since: '2023', sets: 'Deep, Minimal, Atmospheric' },
  { name: 'Tommaso Mancò',    slug: 'tommaso-manco',    role: 'DJ',                                     img: 'assets/dj-manco.jpg',   n: '02', freq: '128 Hz', origin: 'Bologna, IT', since: '2023', sets: 'Tech, Driving, Raw' },
  { name: 'Alberto B',        slug: 'alberto-b',        role: 'DJ · Producer',                         img: 'assets/dj-alberto.jpg', n: '03', freq: '125 Hz', origin: 'Bologna, IT', since: '2024', sets: 'Deep Tech, Groove' },
  { name: 'Leonardo Giusti',  slug: 'leonardo-giusti',  role: 'DJ',                                    img: 'assets/dj-giusti.jpg',  n: '04', freq: '126 Hz', origin: 'Bologna, IT', since: '2024', sets: 'Deep, Melodic' },
];

const GUESTS = [
  'Adime','Alberto B','Axëw','Blaqq & Why\'d','Borosness','Buba',
  'Devid Rama','Federico Apadula','Felow','Gemi','Ginevra Marescotti',
  'Groover','Iari Santi','Leonardo Giusti','Luca Paolella','Matteo Fava',
  'Matteo Gatti','Milo','Nesh','Ocular','Rando','Sara Ru','Seba Ruiz',
  'Tomi & Kesh','Tommaso Mancò','Tommy Terzi',
];

function ArtistsPage() {
  const C = window.Cv8;
  const R = window.R8;
  const mono = { fontFamily: "'JetBrains Mono', monospace" };
  const briq = { fontFamily: "'Archivo', sans-serif" };
  const [hovered, setHovered] = React.useState(null);
  const [isMobile, setIsMobile] = React.useState(window.innerWidth < 768);
  React.useEffect(() => {
    const r = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', r, { passive: true });
    return () => window.removeEventListener('resize', r);
  }, []);

  return (
    <div style={{ background: C.light, minHeight: '100vh' }}>
      <window.Nav8 />
      <window.PageHero section="// 03 / RESIDENTS" title={"Four residents.\nOne direction"} light={true} />

      {/* Residents grid */}
      <section style={{ background: C.light, padding: 'clamp(48px,6vh,80px) clamp(20px,4vw,56px)' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(280px,1fr))', gap: 2, maxWidth: 1400, margin: '0 auto' }}>
          {RESIDENTS.map((r, i) => (
            <R key={r.name} delay={i * 0.08}>
              <a
                href={`/artist-${r.slug}.html`}
                onMouseEnter={() => setHovered(i)}
                onMouseLeave={() => setHovered(null)}
                aria-label={`View ${r.name}'s profile`}
                style={{ position: 'relative', overflow: 'hidden', background: C.dark, display: 'block' }}
              >
                <img
                  src={r.img} alt={r.name}
                  loading={i < 2 ? 'eager' : 'lazy'}
                  style={{
                    width: '100%', aspectRatio: '3/4', objectFit: 'cover', display: 'block',
                    filter: `saturate(0.65) brightness(${hovered === i ? 0.5 : 0.75}) contrast(1.1)`,
                    transform: hovered === i ? 'scale(1.03)' : 'scale(1)',
                    transition: 'filter 0.6s cubic-bezier(.22,1,.36,1), transform 0.6s cubic-bezier(.22,1,.36,1)',
                  }}
                />
                <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg,transparent 35%,rgba(8,8,13,0.92) 100%)' }} />
                <div style={{ position: 'absolute', top: 18, left: 18, ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.light + '88' }}>HZ — {r.n}</div>
                <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: '0 22px 24px' }}>
                  <div style={{ ...mono, fontSize: 10, color: C.light + '77', letterSpacing: '0.14em', marginBottom: 6 }}>{r.role}</div>
                  <h3 style={{ ...briq, fontSize: 'clamp(1.4rem,2.5vw,1.9rem)', fontWeight: 800, letterSpacing: '-0.03em', color: C.light, lineHeight: 1.0 }}>{r.name}</h3>
                  <div style={{
                    height: (isMobile || hovered === i) ? 'auto' : 0,
                    overflow: 'hidden',
                    transition: 'height 0.4s cubic-bezier(.22,1,.36,1)',
                    marginTop: (isMobile || hovered === i) ? 0 : 0,
                  }}>
                    <div style={{ paddingTop: 14, borderTop: `1px solid ${C.light}18`, marginTop: 12 }}>
                      <div style={{ ...mono, fontSize: 10, color: C.light + '66', letterSpacing: '0.16em', marginBottom: 4 }}>// SOUND</div>
                      <div style={{ fontSize: 12, color: C.light + '99' }}>{r.sets}</div>
                    </div>
                  </div>
                </div>
              </a>
            </R>
          ))}
        </div>
      </section>

      {/* Guest artists */}
      <section style={{ background: C.dark, padding: 'clamp(64px,10vh,110px) clamp(20px,4vw,56px)' }}>
        <R>
          <div style={{ maxWidth: 1400, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 48, alignItems: 'start' }}>
            <div>
              <div style={{ ...mono, fontSize: 11, letterSpacing: '0.2em', color: C.blue, marginBottom: 16 }}>// ON OUR DANCEFLOOR</div>
              <h2 style={{ ...briq, fontSize: 'clamp(2rem,6vw,5rem)', fontWeight: 800, lineHeight: 0.9, letterSpacing: '-0.04em', color: C.light, marginBottom: 24 }}>
                Every name on<br />the dancefloor<span style={{ color: C.blue }}>.</span>
              </h2>
              <p style={{ fontSize: 'clamp(14px,1.4vw,16px)', color: C.light + '88', lineHeight: 1.8, maxWidth: 480, textWrap: 'pretty' }}>
                Residents, guests and friends — everyone who's stepped behind the booth and given something real to a Hertz night. No filler. Only the dance.
              </p>
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, paddingTop: 4 }}>
              {GUESTS.map(a => (
                <span
                  key={a}
                  style={{
                    border: `1px solid ${C.light}1e`, padding: '8px 14px',
                    ...mono, fontSize: 11, color: C.light + 'aa', letterSpacing: '0.08em',
                    transition: 'border-color 0.2s, color 0.2s',
                  }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = C.light + '55'; e.currentTarget.style.color = C.light; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = C.light + '1e'; e.currentTarget.style.color = C.light + 'aa'; }}
                >{a}</span>
              ))}
            </div>
          </div>
        </R>
      </section>

      <window.Footer8 />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<ArtistsPage />);
</script>
</body>
</html>
