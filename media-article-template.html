<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hertz Editorial - Deep insights into clubbing culture, sound design, and minimal music">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Hertz">  <link rel="stylesheet" href="fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      background: #08080d;
      color: #f5f5f3;
      font-family: 'HelveticaNeue', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    
    @media (max-width: 768px) {
      * { -webkit-tap-highlight-color: transparent; }
      html { font-size: 14px; }
      body { font-size: 14px; }
      input, textarea, select { font-size: 16px; }
    }
    
    @media (max-width: 480px) {
      html { font-size: 13px; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #08080d; }
    ::-webkit-scrollbar-thumb { background: rgba(20,72,137,0.4); }
    ::selection { background: rgba(0,212,255,0.25); }
    
    img { user-select: none; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    
    /* ── Editorial reading typography ── */
    .article-body {
      color: rgba(236,234,227,0.86);   /* warm off-white, never pure #fff */
      font-size: clamp(18px, 0.6vw + 16px, 20px);
      line-height: 1.7;
      letter-spacing: -0.005em;
    }
    .article-body p { margin: 0 0 1.4em; }
    .article-body strong { font-weight: 700; color: #f3f1ea; }
    .article-body em { font-style: italic; }

    /* opening "in scene", drop cap on first paragraph */
    .article-body > p:first-of-type::first-letter {
      float: left;
      font-size: 3.6em;
      line-height: 0.74;
      font-weight: 800;
      padding: 6px 14px 0 0;
      color: #f5f5f3;
      font-family: 'HelveticaNeue', 'Helvetica Neue', Helvetica, sans-serif;
    }

    .article-body h2 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      margin: 2em 0 0.6em;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.03em;
      color: #f5f5f3;
    }
    .article-body h3 {
      font-size: clamp(1.25rem, 2vw, 1.5rem);
      margin: 1.6em 0 0.5em;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #f5f5f3;
    }

    /* pull quote, breaks the measure, blue rule, no cliché quotes */
    .article-body blockquote {
      margin: 2.2em 0;
      padding-left: 22px;
      border-left: 3px solid #144889;
      font-size: clamp(1.5rem, 2.6vw, 2.05rem);
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -0.02em;
      color: #f5f5f3;
      font-style: normal;
    }
    .article-body blockquote p { margin: 0; }
    @media (min-width: 1040px) {
      .article-body blockquote {
        margin-left: -130px;
        padding-left: 28px;
        max-width: calc(100% + 130px);
      }
    }

    /* in-body images */
    .article-body figure { margin: 2.4em 0; }
    .article-body figure img {
      width: 100%; display: block;
      filter: saturate(0.55) brightness(0.8) contrast(1.04);
    }
    .article-body figcaption {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: 0.08em;
      color: rgba(236,234,227,0.42);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <script type="text/babel" src="/hertz-shared.jsx"></script>
  <script type="text/babel" src="/hertz-editorial-components.jsx"></script>

  <script type="text/babel">
    // Get article slug from URL path
    const slug = window.location.pathname.split('/').pop().replace('.html', '');
    
    function ArticlePage() {
      const C = window.Cv8;
      return (
        <div style={{ background: C.dark, minHeight: '100vh' }}>
          <window.Nav8 />
          
          <main style={{
            padding: 'clamp(48px, 8vh, 96px) clamp(20px, 4vw, 56px)',
            maxWidth: 1400,
            margin: '0 auto',
          }}>
            <window.ArticleDetail slug={slug} />
          </main>

          <window.Footer8 />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ArticlePage />);
  </script>
</body>
</html>
