<!-- 
  Google Analytics 4 Setup
  To activate, get your Measurement ID from Google Analytics and add to index.html head
  
  1. Go to https://analytics.google.com
  2. Create property for https://hertzclubbing.com
  3. Get your Measurement ID (starts with G-)
  4. Add this script to the <head> section of index.html
-->

<!-- Google Analytics 4 Script Template -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX', {
    'page_path': window.location.pathname,
    'anonymize_ip': true,
    'allow_google_signals': true,
  });
</script>

<!-- Event Tracking Examples -->
<script>
// Track form submissions
document.addEventListener('submit', (e) => {
  const formName = e.target?.id || 'contact-form';
  gtag('event', 'form_submit', {
    form_name: formName,
  });
});

// Track event card clicks
document.addEventListener('click', (e) => {
  const eventCard = e.target?.closest('[data-event-id]');
  if (eventCard) {
    gtag('event', 'event_view', {
      event_id: eventCard.dataset.eventId,
      event_name: eventCard.dataset.eventName,
    });
  }
});

// Track scroll depth
let scrollDepthTracked = false;
window.addEventListener('scroll', () => {
  const scrollPercentage = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
  if (scrollPercentage > 75 && !scrollDepthTracked) {
    gtag('event', 'scroll_depth', {
      scroll_percentage: 75,
    });
    scrollDepthTracked = true;
  }
});
</script>
