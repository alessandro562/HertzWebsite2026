<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HERTZ Editorial - Deep insights into clubbing culture, sound design, and minimal music">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="HERTZ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      background: #08080d;
      color: #f5f5f3;
      font-family: 'Bricolage Grotesque', sans-serif;
      overflow-x: hidden;
    }
    @media (max-width: 768px) {
      * { -webkit-tap-highlight-color: transparent; }
      html { font-size: 14px; }
      body { font-size: 14px; }
      input, textarea, select { font-size: 16px; }
    }
    @media (max-width: 480px) { html { font-size: 13px; } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #08080d; }
    ::-webkit-scrollbar-thumb { background: rgba(20,72,137,0.4); }
    ::selection { background: rgba(0,212,255,0.25); }
    img { user-select: none; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    article h2 { font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 32px 0 16px; font-weight: 700; line-height: 1.2; }
    article h3 { font-size: clamp(1.4rem, 2vw, 1.8rem); margin: 24px 0 12px; font-weight: 700; line-height: 1.3; }
    article p { margin-bottom: 16px; }
    article strong { font-weight: 700; color: #f5f5f3; }
    article em { font-style: italic; opacity: 0.88; }
    article blockquote {
      border-left: 3px solid #144889;
      padding: 16px 24px;
      margin: 32px 0;
      background: rgba(20,72,137,0.06);
      font-style: italic;
      font-size: 1.08em;
      line-height: 1.7;
      color: #f5f5f3cc;
    }
    @media (max-width: 768px) {
      article { grid-template-columns: 1fr !important; }
      aside { position: static !important; top: auto !important; margin-top: 48px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script type="text/babel" src="/hertz-shared.jsx"></script>
  <script type="text/babel" src="/hertz-editorial-components.jsx"></script>
  <script type="text/babel">
    const slug = window.location.pathname.split('/').pop().replace('.html', '');
    function ArticlePage() {
      const C = window.Cv8;
      return (
        <div style={{ background: C.dark, minHeight: '100vh' }}>
          <window.Nav8 />
          <main style={{ padding: 'clamp(48px, 8vh, 96px) clamp(20px, 4vw, 56px)', maxWidth: 1400, margin: '0 auto' }}>
            <window.ArticleDetail slug={slug} />
          </main>
          <window.Footer8 />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<ArticlePage />);
  </script>
</body>
</html>
