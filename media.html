]
</script>

  {"key":"ALL","label":"All"},
  {"key":"SIGNAL","label":"Signal"},

<script>
(function(){
  var ARTS=[], RUBS=[];
  try{ ARTS=JSON.parse(document.getElementById('articles-data').textContent); }catch(e){}
  try{ RUBS=JSON.parse(document.getElementById('rubrics-data').textContent); }catch(e){}
  var MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function fdate(iso){ var d=new Date(iso); return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); }
  var grid=document.getElementById('artgrid'), rb=document.getElementById('rubrics'), active='ALL';

  function card(a){
    var lead=a.lead?' lead':'';
    var rub=a.rubric?('<span class="rub">'+a.rubric+'</span>'):'<span class="rub none">NOTE</span>';
    return '<a class="hz-art'+lead+'" href="#'+a.slug+'">'
      +'<div class="img">'+rub+'<span class="reg" style="color:#fff"><b class="a"></b><b class="d"></b></span><img src="'+a.image+'" alt="'+a.title.replace(/"/g,'&quot;')+'" loading="lazy"></div>'
      +'<div class="meta"><span>'+(a.rubric||'EDITORIAL')+'</span><span class="dot">·</span><span>'+fdate(a.date)+'</span></div>'
      +'<h3>'+a.title+'</h3><p>'+a.excerpt+'</p>'
      +'<div class="rt">'+a.rt+' MIN READ · '+a.author+'</div></a>';
  }
  function render(){
    var list=ARTS.filter(function(a){ return active==='ALL' || a.rubric===active; });
    grid.innerHTML=list.map(function(a,i){ var c=Object.assign({},a); if(active!=='ALL'||i!==0) c.lead=false; return card(c); }).join('');
  }
  rb.innerHTML=RUBS.map(function(r){ return '<button role="tab" data-k="'+r.key+'" aria-selected="'+(r.key==='ALL')+'">'+r.label+'</button>'; }).join('');
  rb.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; active=b.dataset.k;
    [].forEach.call(rb.children,function(x){ x.setAttribute('aria-selected', String(x.dataset.k===active)); }); render(); });
  render();
})();
</script>
