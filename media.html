<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hertz Media, Editorial, Archive & Club Culture</title>
  <meta name="description" content="Hertz editorial, photo archive and club culture writing. Articles on minimal and deep-tech, reportage from Bologna, technical analysis.">
  <meta name="theme-color" content="#08080d">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hertz Media, Editorial, Archive & Club Culture">
  <meta property="og:description" content="Editorial, photo archive and club culture writing from Hertz Bologna.">
  <meta property="og:image" content="https://hertz.club/assets/hertz-logo-official.png">
  <meta property="og:url" content="https://hertz.club/media">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hertz Media">
  <meta name="twitter:description" content="Editorial, photo archive and club culture writing from Hertz Bologna.">
  <link rel="canonical" href="https://hertz.club/media">
  <link rel="stylesheet" href="fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body { background: #08080d; color: #f5f5f3; font-family: 'HelveticaNeue', 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #08080d; }
    ::-webkit-scrollbar-thumb { background: rgba(20,72,137,0.4); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(20,72,137,0.7); }
    ::selection { background: rgba(20,72,137,0.30); color: #f5f5f3; }
    img { user-select: none; -webkit-user-drag: none; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    @media (max-width: 768px) {
      * { -webkit-tap-highlight-color: transparent; }
      html { font-size: 14px; }
      body { font-size: 14px; }
    }
    @media (max-width: 480px) { html { font-size: 13px; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="hertz-shared.jsx"></script>
<script type="text/babel" src="hertz-editorial-components.jsx"></script>
<script type="text/babel">

const ARTICLES = [
  {
    slug: "two-speed-island-ibiza-2026",
    title: "The Two-Speed Island: What Ibiza 2026 Is Actually Telling Us",
    subtitle: "A €70 million hyperclub topped the world poll in year one. Read the rest of the calendar and the split becomes impossible to miss.",
    excerpt: "UNVRS didn't just open big — it rewrote the rules in a single season. We read the 2026 Ibiza calendar as two scenes running on the same island at different speeds, and ask what that leaves for everyone who isn't building an arena.",
    image: "assets/media/two-speed-island.jpg",
    rubric: "SIGNAL",
    metadata: { author: 'Hertz Redazione', category: "Editorial", rubric: "SIGNAL", tags: ["ibiza", "unvrs", "hyperclub", "tech-house", "scene", "2026"], publishedAt: "2026-06-26" },
    content: { readingTimeMinutes: 6 },
  },
  {
    slug: "sunwaves-left-home-rominimal",
    title: "Sunwaves Left Home: The Format That Refuses to Scale",
    subtitle: "After 18 years on the Black Sea, the cathedral of the marathon set was pushed out of Romania. What that says about the music we care about most.",
    excerpt: "Sunwaves — no VIP, booth close, six-hour sets — just lost its home to permits and pressure and decamped to Spain. We look at why the most music-first format in our world is also the most structurally fragile, and what it means to keep it alive in a city like ours.",
    image: "assets/media/sunwaves.jpg",
    rubric: "DISPATCH",
    metadata: { author: 'Hertz Redazione', category: "Reportage", rubric: "DISPATCH", tags: ["sunwaves", "rominimal", "minimal", "romania", "marathon-set", "scene"], publishedAt: "2026-06-21" },
    content: { readingTimeMinutes: 6 },
  },
  {
    slug: "music-on-pacha-long-residency",
    title: "Music On at Pacha: The Case for the Long Residency",
    subtitle: "Eight years on the same Friday, despite every rumour of a move. In an age of one-off spectacles, that's not nostalgia — it's a different technology.",
    excerpt: "Music On stayed at Pacha for 2026. We make the case that the long residency builds something a festival headline slot never can — a crowd, a sound, a room — and ask what it teaches anyone running their own night.",
    image: "assets/media/music-on-pacha.jpg",
    rubric: "RESIDENT",
    metadata: { author: 'Hertz Redazione', category: "Reportage", rubric: "RESIDENT", tags: ["music-on", "marco-carola", "pacha", "residency", "ibiza", "tech-house"], publishedAt: "2026-06-16" },
    content: { readingTimeMinutes: 6 },
  },
  {
    slug: "radar-vol-1-eight-names",
    title: "Radar Vol. 1: Eight Names Moving the Groove Right Now",
    subtitle: "Not the most-streamed. The ones whose records keep ending up in our sets — across deep-tech, Latin tech, and the line where they cross.",
    excerpt: "Our first artist column. Eight producers we're actually playing, from UK deep-tech and the Italian groove to Peru and the festival crossover — with the releases, the labels, and an honest read on where each one sits.",
    image: "assets/media/radar-vol-1.jpg",
    rubric: "RADAR",
    metadata: { author: 'Hertz Redazione', category: "Trends", rubric: "RADAR", tags: ["radar", "emerging-artists", "tech-house", "deep-tech", "minimal", "new-music"], publishedAt: "2026-06-11" },
    content: { readingTimeMinutes: 7 },
  },
  {
    slug: "two-people-one-booth-b2b",
    title: "Two People, One Booth: What the B2B Reveals About the Split",
    subtitle: "Everything Always and RPR Soundsystem are both \"two artists, back to back.\" They are not the same thing, and the difference is the whole argument.",
    excerpt: "The b2b has become the scene's basic unit. We pull apart two models — the American mainstage supergroup and the European b2b-as-conversation — and what each one says about where clubbing is going.",
    image: "assets/man-room.jpg",
    rubric: "CROSSFADE",
    metadata: { author: 'Hertz Redazione', category: "Editorial", rubric: "CROSSFADE", tags: ["b2b", "collaboration", "everything-always", "rpr-soundsystem", "tech-house", "scene"], publishedAt: "2026-06-06" },
    content: { readingTimeMinutes: 6 },
  },
];

const RUBRICS = [
  { key: 'ALL',       label: 'All',       desc: 'The full editorial: five recurring columns reading one split scene.' },
  { key: 'SIGNAL',    label: 'Signal',    desc: 'The macro read: where the scene is structurally going.' },
  { key: 'RADAR',     label: 'Radar',     desc: 'Emerging artists we actually play.' },
  { key: 'RESIDENT',  label: 'Resident',  desc: 'The labels and residencies that built the sound.' },
  { key: 'CROSSFADE', label: 'Crossfade', desc: 'The collabs, the b2bs, the aliases, the label moves.' },
  { key: 'DISPATCH',  label: 'Dispatch',  desc: 'Field reportage, from the floor, not the press list.' },
];
const ALL_TAGS = Array.from(new Set(ARTICLES.flatMap(a => (a.metadata.tags || [])))).sort();

function MediaReader({ slug, onClose }) {
  const C = window.Cv8;
  const MONO = { fontFamily: "'JetBrains Mono', monospace" };
  const startY = React.useRef(null);
  const panelRef = React.useRef(null);
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [onClose]);
  return (
    <div role="dialog" aria-modal="true"
      onTouchStart={(e) => { startY.current = (panelRef.current && panelRef.current.scrollTop <= 0) ? e.touches[0].clientY : null; }}
      onTouchMove={(e) => { if (startY.current != null && panelRef.current) { const dy = e.touches[0].clientY - startY.current; panelRef.current.style.transform = dy > 0 ? `translateY(${Math.min(dy, 180)}px)` : 'none'; } }}
      onTouchEnd={(e) => { if (startY.current != null && panelRef.current) { const dy = e.changedTouches[0].clientY - startY.current; panelRef.current.style.transform = 'none'; if (dy > 130) onClose(); } startY.current = null; }}
      style={{ position: 'fixed', inset: 0, zIndex: 200, background: C.dark }}>
      <div ref={panelRef} className="hz-reader-panel hz-noscroll" style={{ position: 'absolute', inset: 0, overflowY: 'auto', WebkitOverflowScrolling: 'touch', transition: 'transform 0.3s cubic-bezier(.22,1,.36,1)' }}>
        <div style={{ position: 'sticky', top: 0, zIndex: 5, display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px clamp(20px,4vw,56px)', background: 'rgba(8,8,13,0.82)', backdropFilter: 'blur(8px)', borderBottom: `1px solid ${C.light}10` }}>
          <span style={{ ...MONO, fontSize: 10, letterSpacing: '0.2em', color: C.light + '55', textTransform: 'uppercase' }}>// Reader</span>
          <button onClick={onClose} aria-label="Close reader" style={{ ...MONO, fontSize: 11, letterSpacing: '0.14em', color: C.light, background: 'transparent', border: `1px solid ${C.light}22`, padding: '8px 14px', cursor: 'pointer', textTransform: 'uppercase', minHeight: 40 }}>Close ✕</button>
        </div>
        <main style={{ padding: 'clamp(28px,5vh,64px) clamp(20px,4vw,56px) 110px', maxWidth: 1400, margin: '0 auto' }}>
          <window.ArticleDetail slug={slug} />
        </main>
      </div>
    </div>
  );
}

function MediaPage() {
  const C = window.Cv8;
  const R = window.R8;
  const mono = { fontFamily: "'JetBrains Mono', monospace" };
  const briq = { fontFamily: "'HelveticaNeue', 'Helvetica Neue', Helvetica, sans-serif" };
  const GRADE = 'saturate(0.55) brightness(0.62) contrast(1.10)';
  const param = (k) => { try { return new URLSearchParams(window.location.search).get(k); } catch (e) { return null; } };
  const [rubric, setRubric] = React.useState(() => (param('rubric') || 'ALL').toUpperCase());
  const [query, setQuery] = React.useState(() => param('q') || '');
  const [tag, setTag] = React.useState(() => param('tag'));
  const [openSlug, setOpenSlug] = React.useState(null);
  const [activeIdx, setActiveIdx] = React.useState(0);

  const codeFor = (a) => 'HZ.' + String(ARTICLES.length - ARTICLES.indexOf(a)).padStart(3, '0');

  const q = query.trim().toLowerCase();
  const filtered = ARTICLES.filter(a => {
    if (rubric !== 'ALL' && String(a.metadata.rubric || '').toUpperCase() !== rubric) return false;
    if (tag && !(a.metadata.tags || []).includes(tag)) return false;
    if (q) {
      const hay = [a.title, a.subtitle, a.excerpt, (a.metadata.tags || []).join(' '), a.metadata.category, a.metadata.rubric || '']
        .join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const latest = ARTICLES.slice(0, 6);
  const cardRefs = React.useRef([]);
  React.useEffect(() => {
    cardRefs.current = cardRefs.current.slice(0, filtered.length);
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { const i = Number(e.target.dataset.idx); if (!Number.isNaN(i)) setActiveIdx(i); } });
    }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
    cardRefs.current.forEach(el => el && io.observe(el));
    return () => io.disconnect();
  }, [rubric, tag, q, filtered.length]);

  const pickRubric = (k) => {
    setRubric(k); setActiveIdx(0);
    try { const u = new URL(window.location); if (k === 'ALL') u.searchParams.delete('rubric'); else u.searchParams.set('rubric', k); window.history.replaceState(null, '', u); } catch (e) {}
  };

  return (
    <div style={{ background: C.dark, minHeight: '100vh' }}>
      <window.Nav8 />
      <style>{`
        html { scroll-snap-type: y proximity; scroll-padding-top: 122px; }
        .hz-noscroll::-webkit-scrollbar { display: none; }
        .hz-noscroll { scrollbar-width: none; }
        @keyframes hzReaderUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .hz-reader-panel { animation: hzReaderUp 0.42s cubic-bezier(.22,1,.36,1); }
        .hz-feedcard:focus-visible { outline: 2px solid ${C.blue}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { html { scroll-snap-type: none; } .hz-reader-panel { animation: none; } }
      `}</style>

      {/* COMPACT HEADER */}
      <header style={{ padding: 'calc(68px + clamp(20px,5vh,44px)) clamp(20px,4vw,56px) 0' }}>
        <div style={{ maxWidth: 1400, margin: '0 auto' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: 20, flexWrap: 'wrap' }}>
            <div>
              <div style={{ ...mono, fontSize: 11, letterSpacing: '0.2em', color: C.blue, marginBottom: 12 }}>04. MEDIA</div>
              <h1 style={{ ...briq, fontSize: 'clamp(2.4rem,7vw,5rem)', fontWeight: 800, lineHeight: 0.9, letterSpacing: '-0.04em', color: C.light, margin: 0 }}>The feed<span style={{ color: C.blue }}>.</span></h1>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', flex: '0 1 300px', minWidth: 180, paddingBottom: 8 }}>
              <span style={{ ...mono, fontSize: 13, color: C.light + '55', marginRight: 8 }}>⌕</span>
              <input value={query} onChange={e => setQuery(e.target.value)} placeholder="SEARCH" aria-label="Search articles"
                style={{ flex: 1, background: 'transparent', border: 'none', outline: 'none', ...mono, fontSize: 12, letterSpacing: '0.1em', color: C.light, borderBottom: `1px solid ${C.light}22`, padding: '8px 0' }} />
              {query && <button onClick={() => setQuery('')} aria-label="Clear search" style={{ ...mono, fontSize: 12, color: C.light + '66', background: 'transparent', border: 'none', cursor: 'pointer', padding: '0 4px' }}>✕</button>}
            </div>
          </div>
          <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.light + '55', margin: '30px 0 12px', textTransform: 'uppercase' }}>// Latest</div>
        </div>
        <div className="hz-noscroll" style={{ display: 'flex', gap: 12, overflowX: 'auto', scrollSnapType: 'x mandatory', WebkitOverflowScrolling: 'touch', padding: '0 clamp(20px,4vw,56px) 4px' }}>
          {latest.map(a => (
            <button key={a.slug} onClick={() => setOpenSlug(a.slug)} className="hz-feedcard" style={{ flex: '0 0 auto', width: 'clamp(148px,40vw,208px)', scrollSnapAlign: 'start', background: C.darkSoft, border: `1px solid ${C.light}10`, padding: 0, cursor: 'pointer', textAlign: 'left' }}>
              <div style={{ position: 'relative', aspectRatio: '4/3', overflow: 'hidden' }}>
                <img src={a.image} alt="" loading="lazy" decoding="async" style={{ width: '100%', height: '100%', objectFit: 'cover', filter: GRADE }} />
                <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg,rgba(8,8,13,0) 40%,rgba(8,8,13,0.85))' }} />
                <div style={{ position: 'absolute', left: 10, bottom: 8, ...mono, fontSize: 9, letterSpacing: '0.18em', color: C.blue }}>// {String(a.metadata.rubric || a.metadata.category).toUpperCase()}</div>
              </div>
              <div style={{ ...briq, fontSize: 12, fontWeight: 700, lineHeight: 1.2, color: C.light, padding: '10px 12px', letterSpacing: '-0.01em', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{a.title}<span style={{ color: C.blue }}>.</span></div>
            </button>
          ))}
        </div>
      </header>

      {/* STICKY RUBRIC PILLS */}
      <div className="hz-noscroll" style={{ position: 'sticky', top: 68, zIndex: 50, background: 'rgba(8,8,13,0.86)', backdropFilter: 'blur(8px)', borderBottom: `1px solid ${C.light}10`, display: 'flex', gap: 8, overflowX: 'auto', padding: '12px clamp(20px,4vw,56px)', marginTop: 30 }}>
        {RUBRICS.map(r => {
          const on = rubric === r.key;
          return (
            <button key={r.key} onClick={() => pickRubric(r.key)} style={{
              ...mono, fontSize: 11, letterSpacing: '0.16em', textTransform: 'uppercase', whiteSpace: 'nowrap',
              padding: '8px 14px', cursor: 'pointer', background: 'transparent', minHeight: 40,
              border: `1px solid ${on ? C.blue : C.light + '18'}`, color: on ? C.blue : C.light + '77', transition: 'all 0.2s',
            }}>{r.label}</button>
          );
        })}
      </div>

      {/* THE FEED */}
      <section style={{ padding: 'clamp(20px,4vh,40px) clamp(16px,4vw,56px) clamp(40px,8vh,96px)' }}>
        <div style={{ maxWidth: 980, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 'clamp(18px,3vh,30px)' }}>
          {filtered.length === 0 && (
            <div style={{ ...mono, fontSize: 12, color: C.light + '55', letterSpacing: '0.16em', textTransform: 'uppercase', padding: '60px 0' }}>// No transmissions match{q ? ` "${query.trim()}"` : tag ? ` #${tag}` : ''}</div>
          )}
          {filtered.map((a, i) => {
            const on = activeIdx === i;
            const rub = String(a.metadata.rubric || a.metadata.category).toUpperCase();
            const rt = a.content && a.content.readingTimeMinutes;
            return (
              <article key={a.slug} data-idx={i} ref={el => { cardRefs.current[i] = el; }}
                className="hz-feedcard" role="button" tabIndex={0} aria-label={`Read: ${a.title}`}
                onClick={() => setOpenSlug(a.slug)}
                onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpenSlug(a.slug); } }}
                style={{
                  position: 'relative', scrollSnapAlign: 'start', cursor: 'pointer',
                  minHeight: 'clamp(540px,84vh,860px)', overflow: 'hidden', background: C.darkSoft,
                  transform: on ? 'scale(1)' : 'scale(0.985)', opacity: on ? 1 : 0.72,
                  transition: 'transform 0.5s cubic-bezier(.22,1,.36,1), opacity 0.5s cubic-bezier(.22,1,.36,1)',
                  willChange: on ? 'transform' : 'auto',
                }}>
                <img src={a.image} alt={(a.media && a.media.heroImageAlt) || ''} loading={i < 2 ? 'eager' : 'lazy'} decoding="async"
                  style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', filter: GRADE, transform: on ? 'scale(1.02)' : 'scale(1)', transition: 'transform 0.7s cubic-bezier(.22,1,.36,1)' }} />
                <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg,rgba(8,8,13,0) 30%,rgba(8,8,13,0.92) 100%)' }} />
                {[['top','left'],['top','right'],['bottom','left'],['bottom','right']].map(([v,h]) => (
                  <span key={v+h} aria-hidden="true" style={{ position: 'absolute', [v]: 14, [h]: 14, width: 16, height: 16, [v === 'top' ? 'borderTop' : 'borderBottom']: `1px solid ${on ? C.blue : C.light + '2e'}`, [h === 'left' ? 'borderLeft' : 'borderRight']: `1px solid ${on ? C.blue : C.light + '2e'}`, transition: 'border-color 0.4s' }} />
                ))}
                {on && <span aria-hidden="true" style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: 2, background: C.blue }} />}
                <div style={{ position: 'absolute', top: 24, left: 24, right: 24, display: 'flex', justifyContent: 'space-between', ...mono, fontSize: 10, letterSpacing: '0.2em' }}>
                  <span style={{ color: on ? C.blue : C.blue, fontWeight: 600 }}>// {rub}</span>
                  <span style={{ color: C.light + '66' }}>{codeFor(a)}</span>
                </div>
                <div style={{ position: 'absolute', left: 24, right: 24, bottom: 26 }}>
                  <h2 style={{ ...briq, fontSize: 'clamp(1.7rem,4.5vw,3rem)', fontWeight: 800, lineHeight: 1.02, letterSpacing: '-0.03em', color: C.light, margin: 0, textWrap: 'balance', maxWidth: '20ch' }}>{a.title}<span style={{ color: C.blue }}>.</span></h2>
                  <p style={{ ...briq, fontSize: 'clamp(14px,1.4vw,16px)', color: C.light + 'cc', lineHeight: 1.45, margin: '12px 0 0', maxWidth: '46ch', textWrap: 'pretty', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{a.subtitle || a.excerpt}</p>
                  <div style={{ ...mono, fontSize: 10, letterSpacing: '0.14em', color: C.light + '88', textTransform: 'uppercase', marginTop: 16, display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
                    <span>{a.metadata.author}</span><span style={{ color: C.blue }}>·</span>
                    {rt ? <span>Runtime {rt}:00</span> : null}
                    <span style={{ marginLeft: 'auto', color: on ? C.blue : C.light + '88' }}>Read ↗</span>
                  </div>
                </div>
              </article>
            );
          })}
        </div>
      </section>

      <window.Footer8 />

      {openSlug && <MediaReader slug={openSlug} onClose={() => setOpenSlug(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MediaPage />);
</script>
</body>
</html>
