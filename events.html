<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HERTZ — Events · Bologna Club Night</title>
  <meta name="description" content="Upcoming and past events from HERTZ — Bologna's minimal and deep-tech club night. Dates, lineups, venues.">
  <meta name="theme-color" content="#08080d">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HERTZ — Events">
  <meta property="og:description" content="Upcoming and past events from HERTZ — Bologna's minimal and deep-tech club night.">
  <meta property="og:image" content="https://hertz.club/assets/hertz-logo-official.png">
  <meta property="og:url" content="https://hertz.club/events">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HERTZ — Events">
  <meta name="twitter:description" content="Upcoming and past events from HERTZ — Bologna's minimal and deep-tech club night.">
  <link rel="canonical" href="https://hertz.club/events">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body { background: #08080d; color: #f5f5f3; font-family: 'Bricolage Grotesque', sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #08080d; }
    ::-webkit-scrollbar-thumb { background: rgba(20,72,137,0.4); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(20,72,137,0.7); }
    ::selection { background: rgba(0,212,255,0.25); color: #f5f5f3; }
    img { user-select: none; -webkit-user-drag: none; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    @media (max-width: 768px) {
      * { -webkit-tap-highlight-color: transparent; }
      html { font-size: 14px; }
      body { font-size: 14px; }
      input, textarea, select { font-size: 16px; }
      button { min-height: 44px; }
    }
    @media (max-width: 480px) { html { font-size: 13px; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="hertz-shared.jsx"></script>
<script type="text/babel">
// Placeholder cards — posters & lineups to be announced. Sorted by date.
const UPCOMING = [
  { title: 'Hertz / Dumbo',              type: 'Hertz Night', day: 'SUN 21.06', venue: 'Dumbo',              city: 'Bologna',    n: '026', ctaLabel: 'Info', ctaLink: '#' },
  { title: 'Hertz / Il Pallone',         type: 'Hertz Night', day: 'SAT 04.07', venue: 'Il Pallone',         city: 'Bologna',    n: '027', ctaLabel: 'Info', ctaLink: '#' },
  { title: 'Hertz / Barracuda Club',     type: 'Guest',       day: 'SAT 25.07', venue: 'Barracuda Club',     city: 'Ferrara',    n: '028', ctaLabel: 'Info', ctaLink: '#' },
  { title: 'Hertz × Buongiorno Classic', type: 'Guest',       day: 'SUN 26.07', venue: 'Buongiorno Classic', city: 'Rimini',     n: '029', ctaLabel: 'Info', ctaLink: '#' },
  { title: 'Hertz × Buongiorno Classic', type: 'Guest',       day: 'TUE 28.07', venue: 'Buongiorno Classic', city: 'Rimini',     n: '030', ctaLabel: 'Info', ctaLink: '#' },
  { title: "Hertz / Noah's Dream",       type: 'Guest',       day: 'TUE 28.07', venue: "Noah's Dream",       city: 'Lido Riccio', n: '031', ctaLabel: 'Info', ctaLink: '#' },
];

const PAST = [
  { title: 'Take Notes × Buongiorno Classic',        type: 'Guest / Showcase', date: '31 May 2026', venue: 'Buongiorno Classic', city: 'Rimini',  n: '025', poster: 'assets/poster-31mag26-take notes x buongiorno classic.png' },
  { title: 'Hertz × Undersound',                     type: 'Collab',      date: '29 May 2026', venue: 'Cassero',     city: 'Bologna', n: '024', poster: 'assets/poster-29mag26-cassero.png' },
  { title: 'Hertz / Kindergarten',                   type: 'Hertz Event', date: '24 Apr 2026', venue: 'Kindergarten', city: 'Bologna', n: '023', poster: 'assets/poster-24apr26-kindergarten.png', tag: 'Sold Out' },
  { title: 'Hertz / Kindergarten',                   type: 'Hertz Event', date: '27 Feb 2026', venue: 'Kindergarten', city: 'Bologna', n: '022', poster: 'assets/poster-27feb26-kindergarten.png' },
  { title: 'Hertz / Kindergarten',                   type: 'Hertz Event', date: '26 Dec 2025', venue: 'Kindergarten', city: 'Bologna', n: '021', poster: 'assets/poster-26dic25-kindergarten.png' },
  { title: 'Buongiorno Classic Goes To Hertz',       type: 'Collab',      date: '22 Nov 2025', venue: 'Numa Club',    city: 'Bologna', n: '020', poster: 'assets/poster-22nov25-hertz x buongiorno classic at numa club.png' },
  { title: 'Hertz / Kindergarten',                   type: 'Hertz Event', date: '24 Oct 2025', venue: 'Kindergarten', city: 'Bologna', n: '019', poster: 'assets/poster-24ott25-kindergarten.png' },
  { title: 'Classic Airlines / Boarding Pass',       type: 'Collab',      date: '21 Sep 2025', venue: 'Classic Airlines', city: 'Rimini', n: '018', poster: 'assets/poster-21set25-buongiorno classic pres. classic airlines.png' },
];

function EventsPage() {
  const C = window.Cv8;
  const R = window.R8;
  const mono = { fontFamily: "'JetBrains Mono', monospace" };
  const briq = { fontFamily: "'Archivo', sans-serif" };

  return (
    <div style={{ background: C.dark, minHeight: '100vh' }}>
      <window.Nav8 />
      <window.PageHero section="// 01 / EVENTS" title="Every night" sub="Bologna · Rimini · Ferrara · Adriatic Coast" />

      {/* UPCOMING */}
      <section style={{ background: C.light, padding: 'clamp(56px,8vh,96px) clamp(20px,4vw,56px)' }}>
        <R>
          <div style={{ ...mono, fontSize: 11, letterSpacing: '0.2em', color: C.blue, marginBottom: 12 }}>// UPCOMING</div>
          <h2 style={{ ...briq, fontSize: 'clamp(2rem,6vw,5rem)', fontWeight: 800, lineHeight: 0.9, letterSpacing: '-0.04em', color: C.dark, marginBottom: 48 }}>
            What's next<span style={{ color: C.blue }}>.</span>
          </h2>
        </R>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(320px,1fr))', gap: 24 }}>
          {UPCOMING.map((e, i) => (
            <R key={i} delay={i * 0.1}>
              <div style={{ background: C.dark, color: C.light, overflow: 'hidden', position: 'relative', border: `1px solid ${C.light}12` }}>
                {e.poster ? (
                  <div style={{ position: 'relative', overflow: 'hidden' }}>
                    <img
                      src={e.poster} alt={e.title}
                      loading="lazy"
                      style={{ width: '100%', aspectRatio: '9/10', objectFit: 'cover', display: 'block', filter: 'brightness(0.78)', transition: 'transform 0.5s cubic-bezier(.22,1,.36,1)' }}
                    />
                    <div style={{ position: 'absolute', top: 14, left: 14, background: C.blue, color: C.light, padding: '4px 10px', ...mono, fontSize: 9, letterSpacing: '0.14em', textTransform: 'uppercase' }}>{e.type}</div>
                  </div>
                ) : (
                  <div style={{ position: 'relative', aspectRatio: '9/10', background: `linear-gradient(150deg, ${C.darkSoft} 0%, ${C.dark} 70%)`, borderBottom: `1px solid ${C.blue}`, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', padding: 24, overflow: 'hidden' }}>
                    <div style={{ position: 'absolute', top: 14, left: 14, background: C.blue, color: C.light, padding: '4px 10px', ...mono, fontSize: 9, letterSpacing: '0.14em', textTransform: 'uppercase' }}>{e.type}</div>
                    <div aria-hidden="true" style={{ position: 'absolute', right: -8, top: '34%', ...briq, fontSize: 'clamp(7rem,18vw,11rem)', fontWeight: 800, lineHeight: 0.8, letterSpacing: '-0.06em', color: C.light + '08', pointerEvents: 'none', userSelect: 'none' }}>HZ</div>
                    <div style={{ position: 'relative' }}>
                      <div style={{ ...mono, fontSize: 11, color: C.blue, letterSpacing: '0.24em', marginBottom: 8 }}>{e.day.split(' ')[0]}</div>
                      <div style={{ ...briq, fontSize: 'clamp(3rem,8vw,4.5rem)', fontWeight: 800, lineHeight: 0.85, letterSpacing: '-0.04em', color: C.light }}>{e.day.split(' ')[1]}</div>
                    </div>
                  </div>
                )}
                <div style={{ padding: 24 }}>
                  <div style={{ ...mono, fontSize: 10, color: C.light + 'aa', letterSpacing: '0.18em', marginBottom: 8, textTransform: 'uppercase' }}>
                    HZ.{e.n} · {e.day}{e.time ? ` · ${e.time}` : ''}
                  </div>
                  <h3 style={{ ...briq, fontSize: 'clamp(1.3rem,2.5vw,1.8rem)', fontWeight: 800, letterSpacing: '-0.03em', marginBottom: 4, color: C.light }}>{e.title}</h3>
                  {e.subtitle && <p style={{ fontSize: 13, color: C.light + 'aa', marginBottom: 12 }}>{e.subtitle}</p>}
                  <div style={{ ...mono, fontSize: 11, color: C.light + '88', marginBottom: 20 }}>@ {e.venue}, {e.city}</div>
                  <div style={{ borderTop: `1px solid ${C.light}18`, paddingTop: 16, marginBottom: 20 }}>
                    <div style={{ ...mono, fontSize: 9, color: C.light + '55', letterSpacing: '0.2em', marginBottom: 8 }}>// LINEUP</div>
                    {e.lineup ? (
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                        {e.lineup.map(a => (
                          <span key={a} style={{ ...mono, fontSize: 11, color: C.light + 'cc', letterSpacing: '0.08em' }}>{a}</span>
                        ))}
                      </div>
                    ) : (
                      <span style={{ ...mono, fontSize: 11, color: C.light + '99', letterSpacing: '0.08em' }}>Announced soon</span>
                    )}
                  </div>
                  <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
                    <a
                      href={e.ctaLink || '#'}
                      aria-label={`${e.ctaLabel} — ${e.title}`}
                      style={{
                        display: 'inline-flex', alignItems: 'center', background: C.blue, color: C.light, padding: '14px 22px',
                        ...mono, fontSize: 11, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase',
                        transition: 'background 0.2s', minHeight: 44,
                      }}
                      onMouseEnter={e2 => e2.currentTarget.style.background = '#1a5aaf'}
                      onMouseLeave={e2 => e2.currentTarget.style.background = C.blue}
                    >
                      {e.ctaLabel} ↗
                    </a>
                    {(e.address || e.venue) && (
                      <a
                        href={`https://maps.google.com/?q=${encodeURIComponent((e.address || e.venue) + ', ' + e.city)}`}
                        target="_blank" rel="noopener noreferrer"
                        aria-label={`Map for ${e.venue}, ${e.city}`}
                        style={{
                          display: 'inline-flex', alignItems: 'center', border: `1px solid ${C.light}22`, color: C.light + '88', padding: '14px 22px',
                          ...mono, fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase',
                          transition: 'all 0.2s', minHeight: 44,
                        }}
                        onMouseEnter={e2 => { e2.currentTarget.style.borderColor = C.light + '55'; e2.currentTarget.style.color = C.light; }}
                        onMouseLeave={e2 => { e2.currentTarget.style.borderColor = C.light + '22'; e2.currentTarget.style.color = C.light + '88'; }}
                      >Maps ↗</a>
                    )}
                  </div>
                </div>
              </div>
            </R>
          ))}
        </div>
      </section>

      {/* PAST EVENTS */}
      <section style={{ background: C.dark, padding: 'clamp(56px,8vh,96px) clamp(20px,4vw,56px)' }}>
        <R>
          <div style={{ ...mono, fontSize: 11, letterSpacing: '0.2em', color: C.blue, marginBottom: 12 }}>// THE ARCHIVE</div>
          <h2 style={{ ...briq, fontSize: 'clamp(2rem,6vw,5rem)', fontWeight: 800, lineHeight: 0.9, letterSpacing: '-0.04em', color: C.light, marginBottom: 48 }}>
            Past nights<span style={{ color: C.blue }}>.</span>
          </h2>
        </R>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 1, border: `1px solid ${C.light}0a` }}>
          {PAST.map((e, i) => (
            <R key={i} delay={i * 0.06}>
              <div style={{ position: 'relative', overflow: 'hidden', cursor: 'default', borderRight: `1px solid ${C.light}0a` }}
              onMouseEnter={el => { const img = el.currentTarget.querySelector('img'); if (img) img.style.transform = 'scale(1.04)'; }}
              onMouseLeave={el => { const img = el.currentTarget.querySelector('img'); if (img) img.style.transform = 'scale(1)'; }}>
                <img src={e.poster} alt={`${e.title} — ${e.date}`} loading="lazy" style={{ width: '100%', aspectRatio: '3/4', objectFit: 'contain', objectPosition: 'center', display: 'block', filter: 'saturate(0.5) brightness(0.75) contrast(1.1)', transition: 'transform 0.6s cubic-bezier(.22,1,.36,1)', background: '#0b0b12' }} />
                <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg,transparent 50%,rgba(0,0,0,0.85) 100%)' }} />
                <div style={{ position: 'absolute', top: 16, right: 16, ...mono, fontSize: 10, color: C.light + 'cc', letterSpacing: '0.16em' }}>HZ.{e.n}</div>
                {e.tag && <div style={{ position: 'absolute', top: 16, left: 16, background: C.blue, color: C.light, padding: '4px 10px', ...mono, fontSize: 9, letterSpacing: '0.14em' }}>{e.tag}</div>}
                <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: 20 }}>
                  <div style={{ ...mono, fontSize: 10, color: C.light + '88', letterSpacing: '0.14em', marginBottom: 6 }}>{e.date} · {e.venue}</div>
                  <h3 style={{ ...briq, fontSize: 'clamp(1.1rem,1.8vw,1.4rem)', fontWeight: 800, letterSpacing: '-0.02em', color: C.light }}>{e.title}</h3>
                </div>
              </div>
            </R>
          ))}
        </div>
      </section>

      <window.Footer8 />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<EventsPage />);
</script>
</body>
</html>
