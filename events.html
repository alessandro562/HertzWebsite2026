<script type="text/babel">

function EventsPage() {
  const C = window.Cv8;
  const R = window.R8;
  const mono = { fontFamily: "'JetBrains Mono', monospace" };

                      <span style={{ display: 'block', fontSize: 'clamp(2.4rem,7vw,3.6rem)', fontWeight: 700 }}>SOON<span style={{ color: C.blue }}>.</span></span>
                    </div>
                  </div>
                  <div style={{ padding: 24, textAlign: 'center' }}>
                    <div style={{ ...mono, fontSize: 10, color: C.light + 'aa', letterSpacing: '0.18em', marginBottom: 8, textTransform: 'uppercase' }}>

                    </div>
                    <div style={{ ...mono, fontSize: 12, color: C.light + '99', letterSpacing: '0.1em', textTransform: 'uppercase' }}>{e.city}</div>
                  </div>
                </div>
              ) : (
                <div style={{ background: C.dark, color: C.light, overflow: 'hidden', position: 'relative', border: `1px solid ${C.light}12` }}>
                  {e.poster ? (
                    <div style={{ position: 'relative', overflow: 'hidden' }}>
                      <img
                        src={e.poster} alt={e.title}
                        loading="lazy"
                        style={{ width: '100%', aspectRatio: '3875 / 5463', objectFit: 'cover', objectPosition: 'center', display: 'block', filter: 'brightness(0.9)' }}

                      <div style={{ position: 'absolute', top: 14, left: 14, background: C.blue, color: C.light, padding: '4px 10px', ...mono, fontSize: 9, letterSpacing: '0.14em', textTransform: 'uppercase' }}>{e.type}</div>
                    </div>
                  ) : (
                    <div style={{ position: 'relative', aspectRatio: '3875 / 5463', background: `linear-gradient(150deg, ${C.darkSoft} 0%, ${C.dark} 70%)`, borderBottom: `1px solid ${C.blue}`, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', padding: 24, overflow: 'hidden' }}>

                      <div aria-hidden="true" style={{ position: 'absolute', right: -8, top: '34%', ...briq, fontSize: 'clamp(7rem,18vw,11rem)', fontWeight: 700, lineHeight: 0.8, letterSpacing: '-0.06em', color: C.light + '08', pointerEvents: 'none', userSelect: 'none' }}>HZ</div>

                      {e.lineup ? (

                    </div>
                    <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
                      <a
                        href={`/guestlist.html?e=${encodeURIComponent(e.n)}&t=${encodeURIComponent(e.title)}&d=${encodeURIComponent(e.date)}`}

      {/* PAST EVENTS */}
      <section style={{ background: C.dark, padding: 'clamp(56px,8vh,96px) clamp(20px,4vw,56px)' }}>
        <R>
          <div style={{ ...mono, fontSize: 11, letterSpacing: '0.2em', color: C.blue, marginBottom: 12 }}>// THE ARCHIVE</div>
          <h2 style={{ ...briq, fontSize: 'clamp(2rem,6vw,5rem)', fontWeight: 700, lineHeight: 0.9, letterSpacing: '-0.04em', color: C.light, marginBottom: 48 }}>
            Past nights<span style={{ color: C.blue }}>.</span>
          </h2>
        </R>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 1, border: `1px solid ${C.light}0a` }}>
          {PAST.map((e, i) => (
            <R key={i} delay={i * 0.06}>
              <div style={{ position: 'relative', overflow: 'hidden', cursor: 'default', borderRight: `1px solid ${C.light}0a`, background: C.dark, display: 'flex', flexDirection: 'column' }}>
                <div style={{ position: 'relative', overflow: 'hidden' }}>
                  <img src={e.poster} alt={`${e.title}, ${e.date}`} loading="lazy" style={{ width: '100%', aspectRatio: '3875 / 5463', objectFit: 'cover', objectPosition: 'center', display: 'block', filter: 'saturate(0.7) brightness(0.82) contrast(1.04)' }} />
                  <div style={{ position: 'absolute', top: 14, right: 14, ...mono, fontSize: 10, color: C.light + 'cc', letterSpacing: '0.16em', background: 'rgba(8,8,13,0.55)', padding: '3px 8px' }}>HZ.{e.n}</div>

                </div>
                <div style={{ padding: '16px 18px 20px' }}>
                  <div style={{ ...mono, fontSize: 10, color: C.light + '77', letterSpacing: '0.14em', marginBottom: 6, textTransform: 'uppercase' }}>{e.date} · {e.venue}</div>

                </div>

            </R>
          ))}
        </div>
      </section>

      <window.Footer8 />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<EventsPage />);

/* SEO — Event structured data, generated from the real upcoming events */
(function () {
  try {
    var M = { Jan:'01', Feb:'02', Mar:'03', Apr:'04', May:'05', Jun:'06', Jul:'07', Aug:'08', Sep:'09', Oct:'10', Nov:'11', Dec:'12' };
    var events = UPCOMING.filter(function (e) { return !e.comingSoon && e.date; }).map(function (e) {
      var dm = String(e.date).match(/(\d{1,2}) (\w{3}) (\d{4})/);
      var hm = String(e.time || '').match(/(\d{1,2}):(\d{2})/);
      var iso = null;
      if (dm) {
        var dd = ('0' + dm[1]).slice(-2), mm = M[dm[2]] || '01', yy = dm[3];
        var hh = hm ? ('0' + hm[1]).slice(-2) : '22', mi = hm ? hm[2] : '00';
        iso = yy + '-' + mm + '-' + dd + 'T' + hh + ':' + mi + ':00+02:00';
      }
      var ev = {
        '@context': 'https://schema.org', '@type': 'Event',
        name: e.title + (e.venue ? ' @ ' + e.venue : ''),
        startDate: iso,
        eventStatus: 'https://schema.org/EventScheduled',
        eventAttendanceMode: 'https://schema.org/OfflineEventAttendanceMode',
        location: { '@type': 'Place', name: e.venue || e.city, address: { '@type': 'PostalAddress', addressLocality: e.city, addressCountry: 'IT' } },
        performer: (e.lineup || []).map(function (p) { return { '@type': 'Person', name: p }; }),
        organizer: { '@type': 'Organization', name: 'Hertz', url: 'https://hertzclubbing.com' }
      };
      if (e.poster) ev.image = 'https://hertzclubbing.com/' + e.poster;
      return ev;
    });
    if (events.length) {
      var s = document.createElement('script');
      s.type = 'application/ld+json';
      s.text = JSON.stringify(events);
      document.head.appendChild(s);
    }
  } catch (err) {}
})();
</script>
</body>
</html>
