<!DOCTYPE html>
<html lang="en" data-accent="yellow">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — Hertz Clubbing Collective</title>
<link rel="stylesheet" href="ds-base.css">
<link rel="stylesheet" href="hertz-system.css">
<style> html,body{ margin:0; background:#08080d; } </style>
</head>
<body>

<!-- ═══════════ DEPARTURES (room / CRT) ═══════════ -->
<section class="hz-sec hz-room crt flick hz-pageintro">
  <div class="hz-scanband"></div>
  <span class="reg"><b class="a"></b><b class="b2"></b><b class="c"></b><b class="d"></b></span>
  <div class="hz-wrap hz-wide">
    <div class="hz-kick" style="margin-bottom:18px"><span class="ln"></span>// DEPARTURES · LIVE BOARD</div>
    <h1 style="font-family:var(--disp);font-size:clamp(2.6rem,7vw,5.6rem);line-height:.82;letter-spacing:-.05em;margin:0 0 14px"><span class="w2">What's</span> <span class="w9 it">next</span><span class="blue">.</span></h1>
    <div class="hz-board" data-board="board-data" style="margin-top:clamp(28px,4vw,48px)">
      <div class="hz-brow head">
        <span>Date</span><span>Event</span><span class="hv">Venue</span><span class="hc">City</span><span style="text-align:right">Status</span>
      </div>
    </div>
    <div class="hz-railhint" style="margin-top:14px"><span class="hz-dot"></span><span>FLAPS LOAD ON SCROLL · NEXT MARKED ▸</span></div>
  </div>
</section>

<!-- ═══════════ UPCOMING grid (page / riso) ═══════════ -->
<section class="hz-sec hz-page riso">
  <span class="reg"><b class="a"></b><b class="b2"></b><b class="c"></b><b class="d"></b></span>
  <div class="hz-wrap hz-wide">
    <div class="hz-ix rise">
      <h2 class="hz-num">0<span class="sl">1</span></h2>
      <div>
        <div class="hz-kick"><span class="ln"></span>// UPCOMING</div>
        <h3 class="hz-h2"><span class="w2">On the</span> <span class="w9 it">calendar</span><span class="blue">.</span></h3>
      </div>
      <div class="hz-meta">07 DATES<br>SUMMER 2026<br>FROM N°026</div>
    </div>
    <div class="hz-postergrid rise">
    </div>
  </div>
</section>

<!-- ═══════════ ARCHIVE grid (room / dark) ═══════════ -->
<section class="hz-sec hz-room crt flick">
  <div class="hz-scanband"></div>
  <span class="reg"><b class="a"></b><b class="b2"></b><b class="c"></b><b class="d"></b></span>
  <div class="hz-wrap hz-wide">
    <div class="hz-ix rise">
      <h2 class="hz-num">0<span class="sl">2</span></h2>
      <div>
        <div class="hz-kick"><span class="ln"></span>// THE ARCHIVE</div>
        <h3 class="hz-h2"><span class="w2">Nights on</span> <span class="w9 it">record</span><span class="blue">.</span></h3>
      </div>
      <div class="hz-meta">PAST TRANSMISSIONS<br>2025 — 2026<br>N°018 → 025</div>
    </div>
    <div class="hz-postergrid rise">
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script type="application/json" id="board-data">[]</script>

<script src="events-data.js"></script>
<script src="events-render.js"></script>
<script src="chrome.js"></script>
<script src="hertz-system.js"></script>
</body>
</html>
