<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hertz Bookings — Book the format or a resident</title>
  <meta name="description" content="Book the Hertz format or one of the Hertz residents for your event. Bologna, minimal and deep-tech.">
  <meta name="theme-color" content="#08080d">
  <meta property="og:title" content="Hertz Bookings">
  <meta property="og:description" content="Book the Hertz format or a Hertz resident for your event.">
  <link rel="canonical" href="https://hertzclubbing.com/bookings">
  <link rel="stylesheet" href="fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body { background: #08080d; color: #f5f5f3; font-family: 'HelveticaNeue', 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(20,72,137,0.4); }
    ::selection { background: rgba(20,72,137,0.30); color: #f5f5f3; }
    a { color: inherit; text-decoration: none; }
    input, select, textarea { font-family: inherit; }
    @media (max-width: 768px) { html { font-size: 14px; } input, select, textarea { font-size: 16px; } }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel" src="hertz-shared.jsx"></script>
<script type="text/babel">
const RESIDENTS = ['Federico Apadula', 'Tommaso Mancò', 'Alberto B', 'Leonardo Giusti'];

function BookingsPage() {
  const C = window.Cv8;
  const R = window.R8;
  const mono = { fontFamily: "'JetBrains Mono', monospace" };
  const briq = { fontFamily: "'HelveticaNeue', 'Helvetica Neue', Helvetica, sans-serif" };

  const [f, setF] = React.useState({ firstName: '', lastName: '', phone: '', email: '', type: 'hertz', artist: RESIDENTS[0], eventName: '', date: '', city: '', budget: '', message: '' });
  const [status, setStatus] = React.useState('idle'); // idle | sending | done | error
  const set = (k) => (e) => setF(s => ({ ...s, [k]: e.target.value }));

  const submit = (e) => {
    e.preventDefault();
    if (!f.firstName.trim() || !f.lastName.trim() || !f.phone.trim() || !/.+@.+\..+/.test(f.email.trim())) { setStatus('error'); return; }
    setStatus('sending');
    fetch('/api/booking', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(f) })
      .then(r => r.ok ? setStatus('done') : setStatus('failed'))
      .catch(() => setStatus('failed'));
  };

  const label = { ...mono, fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: C.light + '88', marginBottom: 8, display: 'block' };
  const field = { width: '100%', background: 'transparent', border: `1px solid ${C.light}22`, color: C.light, padding: '13px 14px', ...mono, fontSize: 13, letterSpacing: '0.03em', outline: 'none' };

  return (
    <div style={{ background: C.dark, minHeight: '100vh' }}>
      <window.Nav8 />
      <window.PageHero section="// BOOKINGS" title="Book Hertz" sub="The Hertz format, or one of the residents, for your night." />

      <section style={{ padding: 'clamp(40px,6vh,72px) clamp(20px,4vw,56px) clamp(72px,12vh,140px)' }}>
        <div style={{ maxWidth: 1120, margin: '0 auto' }}>
          {status === 'done' ? (
            <R>
              <div style={{ maxWidth: 620 }}>
                <div className="hz-card hz-card--panel" style={{ position: 'relative', padding: 'clamp(32px,5vw,56px)' }}>
                  <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.blue, marginBottom: 14 }}>// REQUEST RECEIVED</div>
                  <h2 style={{ ...briq, fontSize: 'clamp(1.8rem,4vw,2.8rem)', fontWeight: 700, letterSpacing: '-0.03em', lineHeight: 1, color: C.light, marginBottom: 16 }}>We're on it<span style={{ color: C.blue }}>.</span></h2>
                  <p style={{ fontSize: 15, lineHeight: 1.7, color: C.light + 'aa', maxWidth: 440 }}>Thanks {f.firstName.trim()}. We'll get back to {f.email.trim()} shortly to talk dates and details.</p>
                </div>
              </div>
            </R>
          ) : (
            <R>
              <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: 'clamp(22px,2.6vw,30px)' }}>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: 'clamp(28px,3.5vw,56px)', alignItems: 'stretch' }}>

                  {/* LEFT, who's asking */}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 'clamp(20px,2.4vw,26px)' }}>
                    <div>
                      <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.blue, marginBottom: 16 }}>// GENERAL INFO</div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: 16 }}>
                        <div><label style={label}>First name *</label><input value={f.firstName} onChange={set('firstName')} style={field} required /></div>
                        <div><label style={label}>Last name *</label><input value={f.lastName} onChange={set('lastName')} style={field} required /></div>
                        <div><label style={label}>Phone *</label><input value={f.phone} onChange={set('phone')} type="tel" style={field} required /></div>
                        <div><label style={label}>Email *</label><input value={f.email} onChange={set('email')} type="email" style={field} required /></div>
                      </div>
                    </div>

                    <div>
                      <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.blue, marginBottom: 14 }}>// INTERESTED IN</div>
                      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                        {[['hertz', 'Hertz format'], ['artist', 'Single artist']].map(([v, l]) => (
                          <button type="button" key={v} onClick={() => setF(s => ({ ...s, type: v }))} style={{
                            ...mono, fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', padding: '11px 18px', cursor: 'pointer',
                            border: `1px solid ${f.type === v ? C.blue : C.light + '22'}`, background: f.type === v ? C.blue : 'transparent', color: f.type === v ? C.light : C.light + '88', transition: 'all 0.2s',
                          }}>{l}</button>
                        ))}
                      </div>
                      {f.type === 'artist' && (
                        <div style={{ marginTop: 16 }}>
                          <label style={label}>Which resident</label>
                          <select value={f.artist} onChange={set('artist')} style={field}>
                            {RESIDENTS.map(r => <option key={r} value={r} style={{ background: C.dark }}>{r}</option>)}
                          </select>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* RIGHT, the event */}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 'clamp(20px,2.4vw,26px)' }}>
                    <div>
                      <div style={{ ...mono, fontSize: 10, letterSpacing: '0.2em', color: C.blue, marginBottom: 16 }}>// THE EVENT</div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: 16 }}>
                        <div><label style={label}>Event name</label><input value={f.eventName} onChange={set('eventName')} style={field} /></div>
                        <div><label style={label}>Date</label><input value={f.date} onChange={set('date')} placeholder="DD.MM.YYYY" style={field} /></div>
                        <div><label style={label}>City / venue</label><input value={f.city} onChange={set('city')} style={field} /></div>
                        <div><label style={label}>Budget (optional)</label><input value={f.budget} onChange={set('budget')} style={field} /></div>
                      </div>
                    </div>
                    <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
                      <label style={label}>Message</label>
                      <textarea value={f.message} onChange={set('message')} rows={5} style={{ ...field, resize: 'vertical', flex: 1, minHeight: 120 }} />
                    </div>
                  </div>

                </div>

                {(status === 'error' || status === 'failed') && (
                  <div style={{ ...mono, fontSize: 11, letterSpacing: '0.08em', color: '#d06a6a' }}>
                    {status === 'error' ? '// Fill name, phone and a valid email' : '// Something went wrong — try again or write to info@hertzbookings.com'}
                  </div>
                )}

                <button type="submit" disabled={status === 'sending'} style={{
                  alignSelf: 'flex-start', background: C.blue, color: C.light, border: 'none', padding: '15px 36px', cursor: 'pointer',
                  ...mono, fontSize: 12, letterSpacing: '0.16em', textTransform: 'uppercase', opacity: status === 'sending' ? 0.6 : 1,
                }}>{status === 'sending' ? 'Sending…' : 'Send request →'}</button>
              </form>
            </R>
          )}
        </div>
      </section>

      <window.Footer8 />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<BookingsPage />);
</script>
</body>
</html>
